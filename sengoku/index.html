(() => {
  const nb = CLANS.map(() => new Set());
  EDGES.forEach(([a, b]) => { const ca = CL[PROV[a].clan0].idx, cb = CL[PROV[b].clan0].idx; if (ca !== cb) { nb[ca].add(cb); nb[cb].add(ca); } });
  const pre = { 織田: 0, 武田: 1, 上杉: 2, 毛利: 3, 北条: 4, 今川: 5 };
  const col = CLANS.map(c => pre[c.name] ?? -1);
  const used = PAL.map(() => 0); col.forEach(c => { if (c >= 0) used[c]++; });
  const order = CLANS.map(c => c.idx).filter(i => col[i] < 0)
    .sort((a, b) => PROV.filter(p => p.clan0 === CLANS[b].name).length - PROV.filter(p => p.clan0 === CLANS[a].name).length);
  for (const i of order) {
    const bad = new Set([...nb[i]].map(j => col[j]));
    let best = -1;
    for (let k = 0; k < PAL.length; k++) if (!bad.has(k) && (best < 0 || used[k] < used[best])) best = k;

// ================= MAP RASTER =================
const RS = 0.7, RW = Math.ceil(W * RS), RH = Math.ceil(H * RS);
let region = null, seaDist = null;
const terr = document.createElement('canvas'); terr.width = RW; terr.height = RH;
const tctx = terr.getContext('2d');
const selC = document.createElement('canvas'); selC.width = RW; selC.height = RH;
const sctx = selC.getContext('2d');
let selDrawn = -2;

function noise(x, y) {
  return 6 * Math.sin(x * 0.045 + 1.3) * Math.cos(y * 0.052 - 0.7) + 4 * Math.sin((x + y) * 0.11) + 2.5 * Math.sin(x * 0.23 - y * 0.19);
}
function segD(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay; const l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
  const ex = ax + t * dx - px, ey = ay + t * dy - py; return Math.sqrt(ex * ex + ey * ey);
}
function buildRaster() {
  region = new Int16Array(RW * RH);
  const segs = EDGES.filter(e => !e[2]).map(([a, b]) => [PROV[a].x, PROV[a].y, PROV[b].x, PROV[b].y]);
  const cv = CARVE.map(([lo, la]) => [(lo - LON0) * KX, (LAT0 - la) * KY]);
  const cs = []; for (let k = 0; k < cv.length - 1; k++) cs.push([...cv[k], ...cv[k + 1]]);
  for (let y = 0; y < RH; y++) {
    const wy = (y + 0.5) / RS;
    for (let x = 0; x < RW; x++) {
      const wx = (x + 0.5) / RS;
      let best = -1, bs = 1e9, nl = 1e9;
      for (let i = 0; i < NP; i++) {
        const p = PROV[i]; const dx = wx - p.x, dy = wy - p.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        const e = d - p.r; if (e < nl) nl = e;
        const s = d - p.r * 0.6; if (s < bs) { bs = s; best = i; }
      }
      const nz = noise(wx, wy);
      let land = nl < nz;
      if (!land && nl < 70) for (const s of segs) { if (segD(wx, wy, s[0], s[1], s[2], s[3]) < 17 + nz * 0.5) { land = true; break; } }
      if (land) for (const s of cs) { if (segD(wx, wy, s[0], s[1], s[2], s[3]) < 12 + nz * 0.25) { land = false; break; } }
      region[y * RW + x] = land ? best : -1;
    }
  }
  // 海岸からの距離 (浅瀬の表現用)
  seaDist = new Uint8Array(RW * RH).fill(255);
  let q = [];
  for (let k = 0; k < RW * RH; k++) if (region[k] >= 0) { seaDist[k] = 0; q.push(k); }
  for (let d = 1; d <= 10 && q.length; d++) {
    const nq = [];
    for (const k of q) {
      const x = k % RW;
      const ns = [x > 0 ? k - 1 : -1, x < RW - 1 ? k + 1 : -1, k - RW, k + RW];
      for (const n of ns) if (n >= 0 && n < RW * RH && seaDist[n] === 255) { seaDist[n] = d; nq.push(n); }
    }
    q = nq;
  }
}

function recolor() {
  const img = tctx.createImageData(RW, RH); const d = img.data;
  const own = S.provs.map(p => CL[p.owner].idx);
  const base = [234, 221, 190];
  const cols = CLANS.map(c => c.rgb.map((v, j) => Math.round(base[j] * 0.48 + v * 0.52)));
  const N = RW * RH;
  for (let k = 0; k < N; k++) {
    const r = region[k], x = k % RW, y = (k / RW) | 0, o = k * 4;
    const h = (((x * 73856093) ^ (y * 19349663)) >>> 0) % 9 - 4;
    if (r < 0) {
      const sd = seaDist[k];
      const t = sd < 10 ? (10 - sd) / 10 : 0;
      const w = Math.sin(x * 0.09 + Math.sin(y * 0.05) * 2) > 0.93 ? 6 : 0;
      d[o] = 26 + t * 26 + w; d[o + 1] = 44 + t * 36 + w; d[o + 2] = 68 + t * 40 + w; d[o + 3] = 255;
      continue;
    }
    const c = cols[own[r]], oc = own[r];
    let edge = 0;
    const nbs = [x > 0 ? k - 1 : -1, x < RW - 1 ? k + 1 : -1, y > 0 ? k - RW : -1, y < RH - 1 ? k + RW : -1];
    for (const n of nbs) {
      const rn = n < 0 ? -1 : region[n];
      if (rn < 0) { edge = 3; break; }
      if (rn !== r) edge = Math.max(edge, own[rn] !== oc ? 2 : 1);
    }
    if (edge < 2) {
      const n2 = [x > 1 ? k - 2 : -1, x < RW - 2 ? k + 2 : -1, y > 1 ? k - 2 * RW : -1, y < RH - 2 ? k + 2 * RW : -1];
      for (const n of n2) { const rn = n < 0 ? -1 : region[n]; if (rn >= 0 && own[rn] !== oc) { edge = 2; break; } }
    }
    if (edge === 3) { d[o] = 92; d[o + 1] = 72; d[o + 2] = 48; }
    else if (edge === 2) { d[o] = 58; d[o + 1] = 38; d[o + 2] = 24; }
    else if (edge === 1) { d[o] = c[0] * 0.78; d[o + 1] = c[1] * 0.78; d[o + 2] = c[2] * 0.78; }
    else { d[o] = c[0] + h; d[o + 1] = c[1] + h; d[o + 2] = c[2] + h; }
    d[o + 3] = 255;
  }
  tctx.putImageData(img, 0, 0);
  selDrawn = -2;
}
function drawSel() {
  if (selDrawn === sel) return;
  selDrawn = sel;
  sctx.clearRect(0, 0, RW, RH);
  if (sel < 0) return;
  const img = sctx.createImageData(RW, RH); const d = img.data;
  for (let k = 0; k < RW * RH; k++) {
    if (region[k] !== sel) continue;
    const x = k % RW;
    const e = (x > 0 && region[k - 1] !== sel) || (x < RW - 1 && region[k + 1] !== sel) || region[k - RW] !== sel || region[k + RW] !== sel;
    const o = k * 4;
    if (e) { d[o] = 255; d[o + 1] = 214; d[o + 2] = 90; d[o + 3] = 255; }
    else { d[o] = 255; d[o + 1] = 246; d[o + 2] = 214; d[o + 3] = 70; }
  }
  sctx.putImageData(img, 0, 0);
}

// ================= MAP VIEW =================
const cv = $('#map'), ctx = cv.getContext('2d');
let cw = 1, ch = 1, dpr = 1;
const view = { x: 0, y: 0, z: 1 };
let raf = 0;
const req = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); };
const minZ = () => Math.min(cw / W, ch / H) * 0.95;
function resize() {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cw = Math.max(1, r.width); ch = Math.max(1, r.height);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  clampView(); req();
}
function clampView() {
  view.z = clamp(view.z, minZ(), 2.6);
  const vw = cw / view.z, vh = ch / view.z;
  view.x = vw >= W ? (W - vw) / 2 : clamp(view.x, -40, W - vw + 40);
  view.y = vh >= H ? (H - vh) / 2 : clamp(view.y, -40, H - vh + 40);
}
function centerOn(pi, z) {
  if (z) view.z = z;
  view.x = PROV[pi].x - cw / 2 / view.z; view.y = PROV[pi].y - ch / 2 / view.z; clampView(); req();
}
function zoomAt(f, sx, sy) {
  const wx = view.x + sx / view.z, wy = view.y + sy / view.z;
  view.z = clamp(view.z * f, minZ(), 2.6);
  view.x = wx - sx / view.z; view.y = wy - sy / view.z; clampView(); req();
}

function draw() {
  if (!S || !region) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#1a2c44'; ctx.fillRect(0, 0, cw, ch);
  const z = view.z;
  ctx.save();
  ctx.translate(-view.x * z, -view.y * z); ctx.scale(z, z);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(terr, 0, 0, W, H);
  drawSel();
  if (sel >= 0) ctx.drawImage(selC, 0, 0, W, H);
  // 海路
  ctx.setLineDash([6 / z, 5 / z]); ctx.lineWidth = 1.4 / z; ctx.strokeStyle = 'rgba(190,215,240,.55)';
  for (const [a, b, sea] of EDGES) if (sea) { ctx.beginPath(); ctx.moveTo(PROV[a].x, PROV[a].y); ctx.lineTo(PROV[b].x, PROV[b].y); ctx.stroke(); }
  ctx.setLineDash([]);
  // 選択中の国からの道
  if (sel >= 0) {
    const me = S.provs[sel].owner;
    for (const j of PROV[sel].adj) {
      const foe = S.provs[j].owner !== me;
      ctx.strokeStyle = foe ? (allied(me, S.provs[j].owner) ? 'rgba(120,200,140,.9)' : 'rgba(214,70,50,.95)') : 'rgba(40,30,20,.6)';
      ctx.lineWidth = (foe ? 3 : 2) / z;
      ctx.beginPath(); ctx.moveTo(PROV[sel].x, PROV[sel].y); ctx.lineTo(PROV[j].x, PROV[j].y); ctx.stroke();
    }
  }
  ctx.restore();
  // 城アイコン
  const rr = clamp(8 + 5 * z, 9, 15);
  const showName = z >= 0.55, showHei = z >= 0.85;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < NP; i++) {
    const p = PROV[i], sp = S.provs[i];
    const sx = (p.x - view.x) * z, sy = (p.y - view.y) * z;
    if (sx < -40 || sy < -40 || sx > cw + 40 || sy > ch + 40) continue;
    const c = CL[sp.owner];
    const mine = sp.owner === S.player;
    if (i === sel) { ctx.beginPath(); ctx.arc(sx, sy, rr + 5, 0, 7); ctx.fillStyle = 'rgba(255,214,90,.35)'; ctx.fill(); }
    ctx.beginPath(); ctx.arc(sx, sy, rr, 0, 7); ctx.fillStyle = c.color; ctx.fill();
    ctx.lineWidth = mine ? 2.6 : 1.4; ctx.strokeStyle = mine ? '#ffd65a' : 'rgba(255,255,255,.85)'; ctx.stroke();
    if (allied(S.player, sp.owner)) { ctx.beginPath(); ctx.arc(sx, sy, rr + 2.5, 0, 7); ctx.lineWidth = 1.5; ctx.strokeStyle = '#8fe0a0'; ctx.stroke(); }
    ctx.fillStyle = '#fff'; ctx.font = `800 ${Math.round(rr * 1.05)}px "Shippori Mincho B1", serif`;
    ctx.fillText(c.mon, sx, sy + 0.5);
    if (showName) {
      ctx.font = `700 ${z >= 1.2 ? 12 : 11}px "Zen Kaku Gothic New", sans-serif`;
      const ty = sy + rr + 9;
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(245,236,214,.92)'; ctx.strokeText(p.name, sx, ty);
      ctx.fillStyle = '#2a1d10'; ctx.fillText(p.name, sx, ty);
      if (showHei) {
        ctx.font = `700 10px "Zen Kaku Gothic New", sans-serif`;
        const t = sp.hei >= 1000 ? (sp.hei / 1000).toFixed(1) + '千' : String(sp.hei);
        ctx.strokeText(t, sx, ty + 12); ctx.fillStyle = sp.hei === 0 ? '#b3261e' : '#5a4630'; ctx.fillText(t, sx, ty + 12);
      }
    }
  }
}

function hitProv(sx, sy) {
  const wx = view.x + sx / view.z, wy = view.y + sy / view.z;
  let best = -1, bd = 1e9;
  for (let i = 0; i < NP; i++) { const d = Math.hypot(PROV[i].x - wx, PROV[i].y - wy); if (d < bd) { bd = d; best = i; } }
  if (bd * view.z < 22) return best;
  const x = Math.floor(wx * RS), y = Math.floor(wy * RS);
  if (x >= 0 && y >= 0 && x < RW && y < RH) { const r = region[y * RW + x]; if (r >= 0) return r; }
  return -1;
}

// pointer: drag to pan, pinch to zoom, tap to select
const ptrs = new Map(); let drag = null, pinch = null, moved = false;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) { drag = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y }; moved = false; }
  else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()]; const r = cv.getBoundingClientRect();
    const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: view.z, wx: view.x + mx / view.z, wy: view.y + my / view.z };
    moved = true;
  }
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()]; const r = cv.getBoundingClientRect();
    const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
    view.z = clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, minZ(), 2.6);
    view.x = pinch.wx - mx / view.z; view.y = pinch.wy - my / view.z; clampView(); req();
  } else if (drag) {
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (Math.hypot(dx, dy) > 7) moved = true;
    if (moved) { view.x = drag.vx - dx / view.z; view.y = drag.vy - dy / view.z; clampView(); req(); }
  }
});
const pend = e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size === 0) {
    if (!moved && drag && e.type === 'pointerup') {
      const r = cv.getBoundingClientRect();
      const i = hitProv(e.clientX - r.left, e.clientY - r.top);
      if (!busy) select(i === sel ? -1 : i);
    }
    drag = null; pinch = null;
  } else if (ptrs.size === 1) {
    const [p] = [...ptrs.values()]; drag = { sx: p.x, sy: p.y, vx: view.x, vy: view.y }; pinch = null;
  }
};
cv.addEventListener('pointerup', pend); cv.addEventListener('pointercancel', pend);
cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, { passive: false });

let AC = null;
function sfx(kind) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    const tone = (f, dur, type, vol, f2, at = 0) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + at); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + at + dur);
      g.gain.setValueAtTime(vol, t + at); g.gain.exponentialRampToValueAtTime(0.001, t + at + dur);
      o.connect(g).connect(AC.destination); o.start(t + at); o.stop(t + at + dur + 0.02);
    };
    if (kind === 'don') { tone(110, 0.35, 'sine', 0.5, 45); tone(220, 0.08, 'triangle', 0.15, 90); }
    else if (kind === 'win') { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.35, 'triangle', 0.16, 0, i * 0.11)); }
    else if (kind === 'lose') { [330, 262, 196].forEach((f, i) => tone(f, 0.4, 'sine', 0.18, 0, i * 0.16)); }
    else if (kind === 'tap') tone(660, 0.06, 'triangle', 0.07);
    else if (kind === 'coin') { tone(988, 0.08, 'square', 0.05); tone(1319, 0.14, 'square', 0.05, 0, 0.07); }
  } catch (e) {}
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// ---- 内政・徴兵 ----
function execDev(kind, g, pi) {
  const sp = S.provs[pi], C = S.clans[g.clan];
  if (kind === 'chou') {
    const amt = recAmt(g, pi), cost = recCost(amt);
    if (C.gold < cost) return null;
    C.gold -= cost; sp.hei += amt; g.done = true; return `兵 +${fmt(amt)}`;
  }
  if (C.gold < COST[kind]) return null;
  const gain = devGain(kind, g);
  C.gold -= COST[kind]; g.done = true;
  if (kind === 'kai') { const v = Math.min(capKoku(pi), sp.koku + gain); const dlt = v - sp.koku; sp.koku = v; return `石高 +${dlt}`; }
  if (kind === 'sho') { const v = Math.min(120, sp.shou + gain); const dlt = v - sp.shou; sp.shou = v; return `商業 +${dlt}`; }
  if (kind === 'chiku') { const v = Math.min(150, sp.jo + gain); const dlt = v - sp.jo; sp.jo = v; return `城 +${dlt}`; }
}
function openCmd(k) {
  if (k === 'atk') return openAttack(sel);
  if (k === 'mov') return openMove(sel);
  const pi = sel, C = S.clans[S.player];
  const names = { kai: '開墾', sho: '商業', chiku: '築城', chou: '徴兵' };
  const descs = { kai: '田畑を広げて秋の収穫を増やします。政治が高いほど効果大。', sho: '町を栄えさせ、毎季の金収入を増やします。政治が高いほど効果大。',
    chiku: '城を固め、守りの戦で受ける被害を減らします。', chou: '兵を集めます。石高と統率が高いほど多く集まります。' };
  const av = availIn(pi).sort((a, b) => k === 'chou' ? b.tou - a.tou : b.sei - a.sei);
  const rows = av.map(g => {
    let gain, cost;
    if (k === 'chou') { gain = '+' + fmt(recAmt(g, pi)) + '兵'; cost = recCost(recAmt(g, pi)); }
    else { gain = '+' + devGain(k, g); cost = COST[k]; }
    return `<button class="row" data-a="go" data-g="${g.id}" ${C.gold < cost ? 'disabled' : ''}><div class="grow"><b>${g.name}</b><small>${k === 'chou' ? '統率' + g.tou : '政治' + g.sei}</small></div><em>${gain}</em><small style="width:48px;text-align:right">${cost}金</small></button>`;
  }).join('');
  openModal(`<h3>${names[k]} ─ ${PROV[pi].name}</h3><p class="sub">${descs[k]}<br>担当する武将を選んでください。（所持金 ${fmt(C.gold)}）</p><div class="list">${rows}</div><button class="btn ghost" data-a="x">やめる</button>`, {
    go: d => {
      const g = genById(+d.g); const msg = execDev(k, g, pi);
      closeModal(); if (msg) { sfx('coin'); toast(`${g.name}：${PROV[pi].name}の${msg}`); }
      render(); req();
    },
  });
}

function autoDomestic() {
  const pc = S.player, C = S.clans[pc]; let n = 0;
  for (const pi of provsOf(pc)) {
    const p = PROV[pi], sp = S.provs[pi];
    const threat = p.adj.filter(j => S.provs[j].owner !== pc && !allied(pc, S.provs[j].owner)).reduce((s, j) => s + S.provs[j].hei, 0);
    for (const g of availIn(pi).sort((a, b) => b.sei - a.sei)) {
      let k;
      const food = (clanHei(pc) + recAmt(g, pi)) * 0.4 <= provsOf(pc).reduce((s, i) => s + S.provs[i].koku, 0) * 100 * 1.1 + C.rice * 0.3;
      if (threat > 0 && sp.hei < threat * 0.9 && food && C.gold >= recCost(recAmt(g, pi)) + 20) k = 'chou';
      else if (threat > 0 && sp.jo < 60 && C.gold >= COST.chiku) k = 'chiku';
      else if (C.gold >= COST.kai) k = sp.koku < capKoku(pi) && (sp.koku <= sp.shou * 1.4 || sp.shou >= 120) ? 'kai' : sp.shou < 120 ? 'sho' : sp.jo < 150 ? 'chiku' : null;
      if (!k) continue;
      if (execDev(k, g, pi)) n++;
    }
  }
  if (n) { sfx('coin'); toast(`おまかせ内政：${n}件の命令を出しました`); }
  else toast('動ける武将か資金が足りません');
  render(); req();
}

// ================= BATTLE =================
const TAC = ['突撃', '射撃', '守備', '計略'];
const TAC_HINT = ['射撃に強い', '守備に強い', '突撃に強い', '知略で揺さぶる'];
const BEAT = [1, 2, 0];
const COUNTER = [2, 0, 1];
const DEAL = [1.25, 1, 0.7, 0.45], TAKE = [1.15, 1, 0.72, 1];
function mkSide(clan, gens, hei, jo) {
  const L = leadOf(gens);
  return { clan, gens, lead: L ? L.tou : 30, leadName: L ? L.name : '足軽大将', chi: gens.length ? Math.max(...gens.map(g => g.chi)) : 30, hei, init: Math.max(1, hei), morale: 100, jo };
}
function aiTac(me, last) {
  if (last != null && last < 3 && R() < 0.3) return COUNTER[last];
  const w = [30, 30, me.jo > 0 ? 32 : 24, me.chi >= 75 ? 16 : me.chi >= 55 ? 9 : 4];
  let t = R() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < 4; i++) { t -= w[i]; if (t < 0) return i; }
  return 0;
}
function roundCalc(A, D, ta, td) {
  let ma = DEAL[ta], md = DEAL[td];
  const notes = []; let moA = 0, moD = 0;
  if (ta < 3 && td < 3) {
    if (BEAT[ta] === td) { ma *= 1.6; md *= 0.6; notes.push(`攻め方の${TAC[ta]}が${TAC[td]}を打ち破った！`); }
    else if (BEAT[td] === ta) { md *= 1.6; ma *= 0.6; notes.push(`守り方の${TAC[td]}が${TAC[ta]}を打ち破った！`); }
    else notes.push('一進一退の攻防。');
  }
  if (ta === 3) {
    if (R() < clamp(0.35 + (A.chi - D.chi) / 100, 0.1, 0.85)) { moD += 20; md *= 0.4; notes.push('攻め方の計略が決まり、守り方が混乱！'); }
    else { moA += 8; md *= 1.2; notes.push('攻め方の計略は見破られた。'); }
  }
  if (td === 3) {
    if (R() < clamp(0.35 + (D.chi - A.chi) / 100, 0.1, 0.85)) { moA += 20; ma *= 0.4; notes.push('守り方の計略が決まり、攻め方が混乱！'); }
    else { moD += 8; ma *= 1.2; notes.push('守り方の計略は見破られた。'); }
  }
  let dD = Math.round(A.hei * 0.14 * lf(A.lead) * ma * TAKE[td] * (0.85 + R() * 0.3) / (1 + D.jo / 100));
  let dA = Math.round(D.hei * 0.14 * lf(D.lead) * md * TAKE[ta] * (0.85 + R() * 0.3));
  dD = Math.min(dD, D.hei); dA = Math.min(dA, A.hei);
  D.hei -= dD; A.hei -= dA;
  A.morale = Math.round(A.morale - dA / A.init * 120 - moA);
  D.morale = Math.round(D.morale - dD / D.init * 120 - moD);
  return { dA, dD, note: notes.join(' ') };
}
function outcome(A, D, round) {
  const ao = A.hei <= 0 || A.morale <= 0, dO = D.hei <= 0 || D.morale <= 0;
  if (dO && !ao) return 'A'; if (ao && !dO) return 'D';
  if (ao && dO) return A.morale > D.morale ? 'A' : 'D';
  return round >= 5 ? 'D' : null;
}
function battle(att, def) {
  const A = mkSide(att.clan, att.gens, att.hei, 0);
  const D = mkSide(def.clan, def.gens, def.hei, def.jo);
  const pc = S.player;
  if (att.clan !== pc && def.clan !== pc) {
    let r = 0, o = null; let la = null, ld = null;
    while (!o) { const ta = aiTac(A, ld), td = aiTac(D, la); roundCalc(A, D, ta, td); la = ta; ld = td; r++; o = outcome(A, D, r); }
    return Promise.resolve({ win: o === 'A', aHei: Math.max(0, A.hei), dHei: Math.max(0, D.hei) });
  }
  return new Promise(resolve => {
    const meA = att.clan === pc;
    const me = meA ? A : D;
    let round = 0, auto = false, lastMine = null, lastFoe = null, done = false;
    const side = (s, isA) => `<div class="bs${s === me ? ' me' : ''}">
      <div class="bn">${monHtml(s.clan, 1)}${s.clan}軍${s === me ? ' <small style="color:var(--gold)">自軍</small>' : ''}</div>
      <div class="bl">大将 ${s.leadName}<br>統${s.lead} 智${s.chi}${isA ? '' : ` · 城${s.jo}`}</div>
      <div class="bar"><i id="${isA ? 'a' : 'd'}h" style="width:100%;background:${CL[s.clan].color}"></i></div>
      <div class="bv"><b id="${isA ? 'a' : 'd'}hv">${fmt(s.hei)}</b> 兵</div>
      <div class="bar mor"><i id="${isA ? 'a' : 'd'}m" style="width:100%"></i></div>
      <div class="bv">士気 <span id="${isA ? 'a' : 'd'}mv">100</span></div></div>`;
    const days = ['一', '二', '三', '四', '五'];
    openModal(`<div class="bh"><h3>${PROV[att.from].name} → ${PROV[def.prov].name}</h3><span id="bday">一日目</span></div>
      <div class="bsides">${side(A, true)}<div class="vs">対</div>${side(D, false)}</div>
      <div class="blog" id="blog">${meA ? '攻め方です。5日のうちに敵の兵か士気を尽きさせれば城を落とせます。' : `<b style="color:var(--red)">${A.clan}家が攻めてきた！</b> 5日守り切れば勝ちです。`}<br><small style="color:var(--dim)">突撃は射撃に、射撃は守備に、守備は突撃に強い。</small></div>
      <div class="tacs" id="tacs">${TAC.map((t, i) => `<button data-a="t" data-i="${i}"><b>${t}</b><small>${TAC_HINT[i]}</small></button>`).join('')}</div>
      <div class="brow"><button data-a="auto">自動で戦う</button>${meA ? '<button data-a="ret">退却する</button>' : '<button data-a="auto">（守りを任せる）</button>'}</div>`, {
      t: d => { if (!auto) play(+d.i); },
      auto: () => { if (!auto) { auto = true; runAuto(); } },
      ret: () => { if (!done) finish('D', true); },
    }, false);
    const upd = () => {
      $('#ah').style.width = (A.hei / A.init * 100) + '%'; $('#dh').style.width = (D.hei / D.init * 100) + '%';
      $('#am').style.width = clamp(A.morale, 0, 100) + '%'; $('#dm').style.width = clamp(D.morale, 0, 100) + '%';
      $('#ahv').textContent = fmt(A.hei); $('#dhv').textContent = fmt(D.hei);
      $('#amv').textContent = Math.max(0, A.morale); $('#dmv').textContent = Math.max(0, D.morale);
    };
    const play = mine => {
      if (done) return;
      const foe = aiTac(meA ? D : A, lastMine);
      const ta = meA ? mine : foe, td = meA ? foe : mine;
      const res = roundCalc(A, D, ta, td);
      lastMine = mine; lastFoe = foe; round++;
      sfx('don'); buzz(25);
      const my = meA ? res.dA : res.dD, their = meA ? res.dD : res.dA;
      $('#blog').innerHTML = `<b>${days[round - 1]}日目</b>　自軍「${TAC[mine]}」／敵「${TAC[foe]}」<br><span class="hit">${res.note}</span><br>自軍 −${fmt(my)}　敵 −${fmt(their)}`;
      const sheet = modal.querySelector('.sheet'); sheet.classList.remove('shake'); void sheet.offsetWidth; sheet.classList.add('shake');
      upd();
      const o = outcome(A, D, round);
      if (o) finish(o, false);
      else $('#bday').textContent = days[round] + '日目';
    };
    const runAuto = async () => {
      $('#tacs').style.opacity = .4;
      while (!done) { await sleep(650); if (done) break; play(aiTac(me, lastFoe)); }
    };
    const finish = (o, retreat) => {
      done = true;
      const myWin = (o === 'A') === meA;
      sfx(myWin ? 'win' : 'lose'); buzz(myWin ? [30, 40, 30] : 120);
      const tname = PROV[def.prov].name;
      const head = meA ? (myWin ? `勝利！ ${tname}を攻め落とした` : retreat ? '兵を退いた' : `敗北… ${tname}を落とせなかった`)
        : (myWin ? `${tname}を守り抜いた！` : `落城… ${tname}を奪われた`);
      $('#tacs').outerHTML = `<div class="blog" style="text-align:center;font-family:var(--mincho);font-size:20px;font-weight:800;color:${myWin ? 'var(--gold)' : 'var(--red)'}">${head}</div>`;
      modal.querySelector('.brow').outerHTML = `<button class="btn" data-a="ok">続ける</button>`;
      MH.ok = () => { closeModal(); resolve({ win: o === 'A', aHei: Math.max(0, A.hei), dHei: Math.max(0, D.hei) }); };
    };
    upd();
  });
}

// 出陣の処理（プレイヤー・CPU共通）
async function doAttack(clan, from, to, gens, hei) {
  const sp = S.provs[from], q = S.provs[to], defClan = q.owner, pc = S.player;
  sp.hei -= hei; gens.forEach(g => { g.done = true; });
  const defGens = gensIn(to, defClan);
  let res;
  if (q.hei <= 0) {
    res = { win: true, aHei: hei, dHei: 0 };
    if (clan === pc) toast(`${PROV[to].name}は空き城だった。戦わずに占領！`);
    if (defClan === pc) { centerOn(to); await ask(`${PROV[to].name}を奪われた`, `守る兵がいない${PROV[to].name}に${clan}家が攻め込み、城は明け渡された。`, [{ label: '続ける', v: 1 }]); }
  } else {
    if (defClan === pc) { centerOn(to); req(); await sleep(250); }
    res = await battle({ clan, from, gens, hei }, { clan: defClan, prov: to, gens: defGens, hei: q.hei, jo: q.jo });
  }
  if (res.win) {
    q.owner = clan; q.hei = res.aHei; q.jo = Math.max(15, Math.round(q.jo * 0.8));
    gens.forEach(g => { g.prov = to; });
    const captured = [];
    for (const g of defGens) {
      const flee = PROV[to].adj.filter(j => S.provs[j].owner === defClan);
      if (flee.length && R() < 0.55) g.prov = pick(flee); else captured.push(g);
    }
    log(`${clan}家が${defClan}家の${PROV[to].name}を攻略。`, clan === pc || defClan === pc);
    recolor(); req();
    if (!provsOf(defClan).length) destroyClan(defClan, clan, captured);
    await handleCaptives(clan, defClan, captured);
  } else {
    q.hei = res.dHei; q.jo = Math.max(10, q.jo - 4);
    if (S.provs[from].owner === clan) sp.hei += res.aHei;
    else {
      const back = PROV[from].adj.filter(j => S.provs[j].owner === clan);
      if (back.length) { const b = pick(back); S.provs[b].hei += res.aHei; gens.forEach(g => { g.prov = b; }); }
    }
    if (clan === pc || defClan === pc) log(`${clan}家の${PROV[to].name}攻めは失敗に終わった。`, true);
  }
}

function destroyClan(c, by, captured) {
  const C = S.clans[c]; C.alive = false;
  for (const g of S.gens) if (g.clan === c && !captured.includes(g)) captured.push(g);
  for (const k of Object.keys(S.ally)) if (k.split('|').includes(c)) delete S.ally[k];
  log(`${c}家、滅亡。`, true);
  if (c !== S.player) toast(`⚔ ${c}家が${by}家に滅ぼされた`, 3000);
}
function succession(c) {
  const C = S.clans[c]; if (!C.alive) return;
  const d = genById(C.daimyo);
  if (d && d.clan === c) return;
  const cand = S.gens.filter(g => g.clan === c).sort((a, b) => (b.tou + b.chi + b.sei) - (a.tou + a.chi + a.sei));
  let nd = cand[0];
  if (!nd) {
    const ps = provsOf(c);
    nd = { id: S.nid++, name: c + pick(['義', '信', '政', '晴', '元', '氏', '景', '長', '高', '忠']) + pick(['康', '光', '興', '久', '直', '綱', '重', '成', '勝', '秀']),
      clan: c, prov: ps[0], tou: 45 + Math.floor(R() * 30), chi: 45 + Math.floor(R() * 30), sei: 45 + Math.floor(R() * 30), done: true };
    S.gens.push(nd);
  }
  C.daimyo = nd.id;
  log(`${c}家の家督を${nd.name}が継いだ。`, c === S.player);
  if (c === S.player) toast(`${nd.name}が家督を継ぎました`, 3000);
}
function releaseTo(g) {
  const ps = provsOf(g.clan);
  if (!ps.length || !S.clans[g.clan].alive) { S.gens = S.gens.filter(x => x !== g); return; }
  g.prov = ps.includes(CL[g.clan].cap) ? CL[g.clan].cap : pick(ps); g.done = true;
}
function removeGen(g) { S.gens = S.gens.filter(x => x !== g); }

async function handleCaptives(winner, loser, caps) {
  if (!caps.length) return;
  const pc = S.player;
  if (winner === pc) {
    for (const g of caps) {
      const isD = S.clans[g.clan].daimyo === g.id && S.clans[g.clan].alive;
      const p = isD ? 0 : S.clans[g.clan].alive ? 55 : 70;
      const v = await ask(`捕虜：${g.name}`, `${g.clan}家の${isD ? '当主' : '武将'}（統${g.tou} 智${g.chi} 政${g.sei}）を捕らえた。${isD ? '当主は決して降らないだろう。' : `登用の見込み ${p}%`}`, [
        { label: '登用する', v: 'hire', cls: isD ? 'ghost' : '' }, { label: '解放する', v: 'free', cls: 'ghost' }, { label: '処断する', v: 'kill', cls: 'red' }]);
      const oc = g.clan;
      if (v === 'hire') {
        if (R() * 100 < p) { g.clan = pc; g.done = true; log(`${g.name}が${pc}家に仕えた。`, true); toast(`${g.name}が家臣になった！`); sfx('win'); }
        else { toast(`${g.name}は登用を拒み、去っていった`); releaseTo(g); }
      } else if (v === 'free') releaseTo(g);
      else { removeGen(g); log(`${g.name}を処断した。`, true); }
      if (isD && v !== 'free') succession(oc);
    }
    return;
  }
  for (const g of caps) {
    const isD = S.clans[g.clan].daimyo === g.id;
    const alive = S.clans[g.clan].alive;
    if (!isD && R() < 0.45) { const from = g.clan; g.clan = winner; g.done = true; const ps = provsOf(winner); g.prov = ps.includes(g.prov) ? g.prov : ps[0]; if (from === pc) log(`${g.name}が捕らえられ、${winner}家に寝返った。`, true); }
    else if (alive && R() < 0.6) { releaseTo(g); if (g.clan === pc) log(`捕らわれた${g.name}が解放されて戻ってきた。`, true); }
    else { const cl = g.clan; removeGen(g); if (cl === pc) log(`${g.name}が${winner}家に討たれた。`, true); if (isD) succession(cl); }
  }
}

// ================= AI =================
function frontierDist(c) {
  const dist = new Array(NP).fill(99), q = [];
  for (const i of provsOf(c)) if (PROV[i].adj.some(j => S.provs[j].owner !== c && !allied(c, S.provs[j].owner))) { dist[i] = 0; q.push(i); }
  while (q.length) { const i = q.shift(); for (const j of PROV[i].adj) if (S.provs[j].owner === c && dist[j] > dist[i] + 1) { dist[j] = dist[i] + 1; q.push(j); } }
  return dist;
}
function aiDecide(c, pi, g, fd) {
  const C = S.clans[c], sp = S.provs[pi], pc = S.player;
  const foes = PROV[pi].adj.filter(j => S.provs[j].owner !== c && !allied(c, S.provs[j].owner));
  const threat = foes.reduce((s, j) => s + S.provs[j].hei, 0);
  // 攻撃
  if (foes.length && sp.hei >= 1000) {
    let best = null;
    const partner = availIn(pi).filter(x => x !== g).sort((a, b) => b.tou - a.tou)[0];
    const lead = Math.max(g.tou, partner ? partner.tou : 0);
    for (const j of foes) {
      const q = S.provs[j];
      if (q.owner === pc && S.turn < 2) continue;
      const other = threat - q.hei;
      const keep = Math.min(sp.hei * 0.4, other * 0.35 + 300);
      const send = Math.floor((sp.hei - keep) / 100) * 100;
      if (send < 800 && q.hei > 0) continue;
      if (send < 100) continue;
      const ratio = send * lf(lead) / (q.hei * (1 + q.jo / 100) * lf(defLead(j)) + 1);
      const score = ratio + (q.owner === pc ? 0.08 : 0) + (j === KYOTO ? 0.1 : 0) + R() * 0.15;
      if (ratio > C.aggr && (!best || score > best.score)) best = { score, j, send };
    }
    if (best) return { type: 'atk', to: best.j, hei: best.send, gens: partner && sp.hei > 3000 ? [g, partner] : [g] };
  }
  // 武将がいない隣国へ移る
  const all = gensIn(pi, c);
  if (all.length >= 2) {
    const empty = PROV[pi].adj.filter(j => S.provs[j].owner === c && !gensIn(j, c).length);
    if (empty.length) return { type: 'gmov', to: pick(empty) };
  }
  // 徴兵
  const amt = recAmt(g, pi), cost = recCost(amt);
  const tot = clanHei(c), harvest = provsOf(c).reduce((s, i) => s + S.provs[i].koku, 0) * 100;
  if (C.gold >= cost && (tot + amt) * 0.4 <= harvest * 1.1 + C.rice * 0.3 && (foes.length && (sp.hei < threat * 0.9 + 800 || R() < 0.3))) return { type: 'chou' };
  // 前線へ兵を送る
  if (fd[pi] > 0 && sp.hei > 1200) {
    const nx = PROV[pi].adj.filter(j => S.provs[j].owner === c && fd[j] < fd[pi]);
    if (nx.length) return { type: 'mov', to: pick(nx), hei: Math.floor((sp.hei - 400) / 100) * 100 };
  }
  // 内政
  const opts = [];
  if (C.gold >= 40) {
    if (sp.koku < capKoku(pi)) opts.push('kai', 'kai');
    if (sp.shou < 120) opts.push('sho');
    if (foes.length && sp.jo < 90 && C.gold >= 50) opts.push('chiku');
  }
  return opts.length ? { type: pick(opts) } : { type: 'none' };
}
async function aiClan(c) {
  const fd = frontierDist(c);
  for (const pi of shuffle(provsOf(c))) {
    if (S.provs[pi].owner !== c) continue;
    const gens = availIn(pi).sort((a, b) => b.tou - a.tou);
    for (const g of gens) {
      if (g.done || g.prov !== pi || g.clan !== c || S.provs[pi].owner !== c || !S.clans[c].alive) continue;
      const act = aiDecide(c, pi, g, fd);
      if (act.type === 'atk') { await doAttack(c, pi, act.to, act.gens, act.hei); if (!S.clans[S.player].alive) return; break; }
      else if (act.type === 'gmov') { g.prov = act.to; g.done = true; }
      else if (act.type === 'mov') { S.provs[pi].hei -= act.hei; S.provs[act.to].hei += act.hei; g.done = true; }
      else if (act.type === 'none') g.done = true;
      else if (!execDev(act.type, g, pi)) g.done = true;
    }
  }
}

// ================= TURN =================
async function endSeason() {
  if (busy) return;
  busy = true; sel = -1; render(); req();
  $('#busy').hidden = false;
  const before = S.log.length ? S.log[0] : null;
  await sleep(60);
  const order = shuffle(Object.keys(S.clans).filter(c => c !== S.player && S.clans[c].alive));
  for (const c of order) {
    if (!S.clans[c].alive) continue;
    await aiClan(c);
    if (!S.clans[S.player].alive) break;
  }
  $('#busy').hidden = true;
  if (!S.clans[S.player].alive || !provsOf(S.player).length) { busy = false; gameOver(); return; }
  const news = []; for (const l of S.log) { if (l === before) break; news.push(l); }
  seasonTick();
  recolor(); busy = false; render(); req();
  const wars = news.filter(l => l.msg.includes('攻略') || l.msg.includes('滅亡'));
  if (wars.length) toast(`📜 ${wars[wars.length - 1].msg}${wars.length > 1 ? ` ほか${wars.length - 1}件` : ''}`, 3200);
  await seasonEvents();
  save();
}
function seasonTick() {
  const pc = S.player;
  S.season++; if (S.season > 3) { S.season = 0; S.year++; for (const c in S.clans) S.clans[c].aggr = 1.15 + R() * 0.35; }
  S.turn++;
  for (const c in S.clans) {
    const C = S.clans[c]; if (!C.alive) continue;
    const ps = provsOf(c);
    const g = ps.reduce((s, i) => s + S.provs[i].shou, 0) * 2;
    C.gold = Math.min(99999, C.gold + g);
    if (S.season === 2) { const h = ps.reduce((s, i) => s + S.provs[i].koku, 0) * 100; C.rice += h; if (c === pc) toast(`🌾 秋の収穫　兵糧 +${fmt(h)}`, 2800); }
    const up = Math.round(ps.reduce((s, i) => s + S.provs[i].hei, 0) / 10);
    C.rice -= up;
    if (C.rice < 0) {
      C.rice = 0;
      ps.forEach(i => { S.provs[i].hei = Math.floor(S.provs[i].hei * 0.85 / 100) * 100; });
      if (c === pc) { log('兵糧が尽き、兵の一部が逃げ出した。', true); toast('⚠ 兵糧不足で兵が逃げ出しています', 3200); }
    }
  }
  for (const g of S.gens) g.done = false;
  for (const k of Object.keys(S.ally)) {
    S.ally[k]--;
    if (S.ally[k] <= 0) { delete S.ally[k]; const [a, b] = k.split('|'); if (a === pc || b === pc) log(`${a === pc ? b : a}家との同盟が期限切れになった。`, true); }
  }
}
async function seasonEvents() {
  const pc = S.player, C = S.clans[pc], mine = provsOf(pc);
  const r = R();
  if (r < 0.08) { const i = pick(mine); const v = S.provs[i].koku * 40; C.rice += v; log(`${PROV[i].name}で豊作。兵糧+${v}`, true); toast(`🌾 ${PROV[i].name}で豊作！ 兵糧 +${fmt(v)}`); }
  else if (r < 0.15) { const v = 50 + Math.floor(R() * 60); C.gold += v; log(`商人から献金。金+${v}`, true); toast(`💰 商人から献金 金 +${v}`); }
  else if (r < 0.21) {
    const low = mine.filter(i => S.provs[i].jo < 60 && S.provs[i].hei > 500);
    if (low.length) { const i = pick(low); const v = Math.floor(S.provs[i].hei * 0.15 / 100) * 100; S.provs[i].hei -= v; log(`${PROV[i].name}で一揆。兵-${v}`, true); toast(`⚠ ${PROV[i].name}で一揆！ 兵 −${fmt(v)}`); }
  } else if (r < 0.28 && S.turn >= 3) {
    const nb = [...neighborsOf(pc)].filter(c => !allied(pc, c) && clanHei(c) < clanHei(pc) * 0.9);
    if (nb.length) {
      const c = pick(nb);
      const v = await ask(`${c}家から使者`, `${monHtml(c, 1)} ${c}家（${provsOf(c).length}国・兵${fmt(clanHei(c))}）が同盟を申し入れてきた。結べば4年間、互いに攻め込まない。`,
        [{ label: '同盟を結ぶ', v: 1 }, { label: '断る', v: 0, cls: 'ghost' }]);
      if (v) { S.ally[allyKey(pc, c)] = 16; log(`${c}家と同盟を結んだ。`, true); toast(`🤝 ${c}家と同盟`); }
    }
  }
  render(); req();
}

function afterPlayerAction() {
  render(); req(); checkWin(); save();
}
async function checkWin() {
  const pc = S.player, n = provsOf(pc).length;
  if (!S.won && n >= WIN_PROVS && provsOf(pc).includes(KYOTO)) {
    S.won = true; save();
    const yrs = S.year - 1560;
    let best = null; try { best = JSON.parse(LS.get(BEST_KEY) || 'null'); } catch (e) {}
    const rec = !best || S.year < best.year;
    if (rec) LS.set(BEST_KEY, JSON.stringify({ year: S.year, clan: pc }));
    sfx('win');
    const v = await ask('天下統一', `${S.year}年${SEASON[S.season]}、${pc}家は京を押さえ、${n}国を従えて天下人となった。<br>挙兵から${yrs}年。${rec ? '<b style="color:var(--gold)">最速記録を更新！</b>' : `（最速記録 ${best.year}年 ${best.clan}家）`}`,
      [{ label: '残る大名も平らげる', v: 1 }, { label: 'タイトルへ', v: 0, cls: 'ghost' }]);
    if (!v) showTitle();
  }
  if (n === NP) { await ask('全国平定', `日ノ本のすべての国が${pc}家のもとに一つになった。`, [{ label: 'タイトルへ', v: 1 }]); LS.del(SAVE_KEY); showTitle(); }
}
async function gameOver() {
  LS.del(SAVE_KEY); sfx('lose');
  await ask(`${S.player}家 滅亡`, `${S.year}年${SEASON[S.season]}、最後の城が落ち、${S.player}家は歴史から姿を消した。`, [{ label: 'タイトルへ', v: 1 }]);
  showTitle();
}

function save() { if (S && S.clans[S.player].alive) LS.set(SAVE_KEY, JSON.stringify(S)); }
function load() {
  try { const s = JSON.parse(LS.get(SAVE_KEY) || 'null'); if (s && s.v === 1 && s.provs && s.provs.length === NP) return s; } catch (e) {}
  return null;
}

// ================= TITLE =================
function showTitle() {
  closeModal();
  const sv = load();
  let best = null; try { best = JSON.parse(LS.get(BEST_KEY) || 'null'); } catch (e) {}
  const title = $('#title'); title.hidden = false;
  $('#titlein').innerHTML = `<div class="eb">SENGOKU · 1560</div><h1>戦国<br>天下録</h1>
    <p class="lead">群雄割拠の世。ひとつの家を選び、内政で国を富ませ、合戦で国を奪い、京を押さえて天下を目指す。</p>
    ${sv ? `<button class="btn" id="cont">続きから　<small style="font-family:var(--sans);font-size:12px;font-weight:500">${sv.player}家 · ${sv.year}年${SEASON[sv.season]}</small></button>` : ''}
    <button class="btn ${sv ? 'ghost' : ''}" id="newg">新しく始める</button>
    ${best ? `<p class="note" style="margin-top:14px;text-align:center">最速の天下統一：${best.year}年（${best.clan}家）</p>` : ''}
    <div class="how"><b>遊び方</b><br>
    ・国をタップして武将に命令。武将は1季節に1回動けます。<br>
    ・<b>開墾</b>で秋の兵糧、<b>商業</b>で毎季の金が増えます。兵は季節ごとに兵糧を食べます。<br>
    ・<b>出陣</b>すると合戦。突撃・射撃・守備の三すくみと計略で5日間戦います。<br>
    ・${WIN_PROVS}国以上と京（山城）を押さえれば天下統一。進行は自動で保存されます。</div>`;
  const nb = $('#newg'); nb.onclick = () => { sfx('tap'); pickClan(); };
  const cb = $('#cont'); if (cb) cb.onclick = () => { sfx('tap'); S = sv; startGame(); };
}
function pickClan() {
  const cs = CLANS.map(c => {
    const ps = PROV.filter(p => p.clan0 === c.name);
    return { c, n: ps.length, hei: ps.reduce((s, p) => s + p.hei, 0), d: c.gens[0][0] };
  }).sort((a, b) => b.n - a.n || b.hei - a.hei);
  $('#titlein').innerHTML = `<div class="eb">大名を選ぶ</div><h1 style="font-size:40px">どの家で<br>天下を狙う？</h1>
    <p class="lead">国の多い家ほど楽に始められます。一国の小大名から成り上がるのも一興。</p>
    <div class="list">${cs.map(x => `<button class="row" data-c="${x.c.name}"><span class="mon" style="background:${x.c.color}">${x.c.mon}</span><div class="grow"><b>${x.c.name}家</b><small>${x.d} · ${PROV[x.c.cap].name} · ${x.n}国 · 兵${fmt(x.hei)}</small></div>
      <span class="diff ${x.n >= 4 ? 'e' : x.n === 1 ? 'h' : ''}">${x.n >= 4 ? '易' : x.n >= 2 ? '普' : '難'}</span></button>`).join('')}</div>
    <button class="btn ghost" id="back">戻る</button>`;
  $('#titlein').querySelectorAll('[data-c]').forEach(b => b.onclick = () => { sfx('tap'); newGame(b.dataset.c); save(); startGame(); });
  $('#back').onclick = showTitle;
  $('#title').scrollTop = 0;
}
function startGame() {
  $('#title').hidden = true;
  sel = -1; busy = false;
  render(); resize(); recolor();
  const ps = provsOf(S.player);
  centerOn(ps.includes(CL[S.player].cap) ? CL[S.player].cap : ps[0], 1.1);
  render(); req();
}

// ================= BOOT =================
$('#titlein').innerHTML = `<div class="eb">SENGOKU · 1560</div><h1>戦国<br>天下録</h1><p class="lead">地図を描いています…</p>`;
window.addEventListener('resize', () => { if (S) resize(); });
if (window.ResizeObserver) new ResizeObserver(() => { if (S) resize(); }).observe($('#mapwrap'));
setTimeout(() => {
  buildRaster();
  showTitle();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(req);
}, 30);
window.__sg = { get S() { return S; }, endSeason, provsOf };
})();
</script>

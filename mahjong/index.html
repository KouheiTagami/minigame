<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>四人麻雀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Outfit:wght@500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d2a26;
    --felt: #145a4b;
    --felt-in: #11493d;
    --line: #2a7a66;
    --ink: #eef6f1;
    --dim: #9ec5b7;
    --gold: #f3c969;
    --red: #ff6b5b;
    --tile: #fbf8ef;
    --tile-side: #d9cfb6;
    --tile-back: #e39b3a;
    --man: #c62828;
    --pin: #1d5fbf;
    --sou: #1f8a4c;
    --mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --num: "Outfit", "Helvetica Neue", Arial, sans-serif;
    --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  main { max-width: 520px; margin: 0 auto; padding-inline: 10px; padding-block: 8px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 100%; box-sizing: border-box; }

  /* ---------- tiles ---------- */
  .t {
    --w: 24px;
    width: var(--w); height: calc(var(--w) * 1.36); flex: none; box-sizing: border-box;
    background: var(--tile); border-radius: calc(var(--w) * 0.12);
    box-shadow: inset 0 0 0 1px #e6dfcc, 0 calc(var(--w) * 0.1) 0 var(--tile-side);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
    line-height: 1; position: relative; color: #1a1a1a;
  }
  .t .n { font-family: var(--mincho); font-weight: 800; font-size: calc(var(--w) * 0.56); }
  .t .s { font-family: var(--mincho); font-weight: 700; font-size: calc(var(--w) * 0.36); margin-top: calc(var(--w) * 0.02); }
  .t.m .s { color: var(--man); }
  .t.p .n, .t.p .s { color: var(--pin); }
  .t.so .n, .t.so .s { color: var(--sou); }
  .t.z .n { font-size: calc(var(--w) * 0.72); }
  .t.hatsu .n { color: var(--sou); } .t.chun .n { color: var(--man); }
  .t.haku::after { content: ""; position: absolute; inset: 22% 20%; border: 2px solid #6a8fd0; border-radius: 2px; }
  .t.red .n { color: var(--man); }
  .t.red::before { content: ""; position: absolute; top: 3px; right: 3px; width: 4px; height: 4px; border-radius: 50%; background: var(--man); }
  .t.back { background: var(--tile-back); box-shadow: 0 calc(var(--w) * 0.1) 0 #a86a1d; }
  .t.dim { opacity: 0.35; }
  .t.rii { transform: rotate(-90deg); margin-inline: calc(var(--w) * 0.18); }
  .t.hl { box-shadow: inset 0 0 0 2px var(--gold), 0 calc(var(--w) * 0.1) 0 var(--tile-side); }

  /* ---------- top info ---------- */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--dim); }
  .top b { color: var(--ink); font-size: 15px; }
  .dora { display: flex; align-items: center; gap: 3px; }
  .dora .t { --w: 18px; }
  .speed { font: 700 11px var(--body); color: var(--dim); background: var(--felt-in); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; cursor: pointer; }

  /* ---------- opponents ---------- */
  .opps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .opp { background: var(--felt-in); border-radius: 10px; padding: 5px 6px; font-size: 11px; display: flex; flex-direction: column; gap: 3px; border: 1.5px solid transparent; min-width: 0; }
  .opp.turn { border-color: var(--gold); }
  .opp .hd { display: flex; justify-content: space-between; gap: 4px; font-weight: 700; }
  .opp .hd span:last-child { font-family: var(--num); }
  .opp .ml { display: flex; flex-wrap: wrap; gap: 1px 3px; min-height: 18px; align-items: flex-end; }
  .opp .ml .t { --w: 12px; }
  .meld { display: flex; gap: 0; }
  .riichi-bar { display: inline-block; width: 22px; height: 5px; border-radius: 3px; background: #fff; position: relative; vertical-align: middle; }
  .riichi-bar::after { content: ""; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; border-radius: 50%; background: var(--red); transform: translate(-50%, -50%); }

  /* ---------- table ---------- */
  .table { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1; background: radial-gradient(circle, var(--felt) 55%, var(--felt-in)); border-radius: 12px; overflow: hidden; }
  .seat { position: absolute; inset: 0; pointer-events: none; }
  .pond { position: absolute; left: 50%; top: 68.5%; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 1px; transform: translateX(-50%); }
  .pond .t { --w: var(--pw); }
  .center { position: absolute; left: 33%; top: 33%; width: 34%; height: 34%; background: #0b231f; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .center .rd { font-family: var(--mincho); font-size: clamp(13px, 4vw, 18px); font-weight: 800; }
  .center .sub { font-size: 10px; color: var(--dim); font-weight: 700; }
  .score { position: absolute; left: 50%; top: 58.5%; transform: translateX(-50%); font: 700 clamp(10px, 2.8vw, 12px) var(--num); color: var(--dim); white-space: nowrap; display: flex; align-items: center; gap: 4px; }
  .score.turn { color: var(--gold); }
  .score .w { font-family: var(--mincho); font-weight: 800; }
  .score .riichi-bar { width: 16px; height: 4px; }

  /* ---------- my area ---------- */
  .me { display: flex; flex-direction: column; gap: 6px; }
  .mymelds { display: flex; justify-content: flex-end; gap: 6px; min-height: 26px; }
  .mymelds .t { --w: 18px; }
  .hand { display: flex; align-items: flex-end; justify-content: center; gap: 1px; min-height: 48px; padding-top: 10px; }
  .hand .t { --w: min(34px, calc((100vw - 40px) / 14.6)); cursor: pointer; transition: transform 0.1s; }
  .hand .t.drawn { margin-left: 6px; }
  .hand .t.up { transform: translateY(-9px); }
  .hand .t.off { opacity: 0.4; cursor: default; }
  .hand .t.tenpai-ok { box-shadow: inset 0 0 0 2px var(--gold), 0 calc(var(--w) * 0.1) 0 var(--tile-side); }
  .actions { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; min-height: 42px; }
  .actions button {
    font: 900 15px var(--body); color: #1b1b1b; background: var(--gold); border: none; border-radius: 12px;
    padding: 10px 16px; cursor: pointer; box-shadow: 0 3px 0 #a9832e; display: flex; align-items: center; gap: 4px;
  }
  .actions button.sub { background: var(--felt-in); color: var(--ink); box-shadow: 0 3px 0 #06201b; border: 1px solid var(--line); }
  .actions button.ron { background: var(--red); color: #fff; box-shadow: 0 3px 0 #a23a2e; }
  .actions button .t { --w: 14px; }
  .actions .hint { font-size: 12px; color: var(--dim); align-self: center; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---------- modals ---------- */
  .modal { position: fixed; inset: 0; z-index: 20; background: rgba(4, 16, 13, 0.82); display: grid; place-items: center; padding-inline: 12px; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 18px 14px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; text-align: center; box-sizing: border-box; }
  .card h2 { margin: 0; font-family: var(--mincho); font-size: 28px; font-weight: 800; }
  .card h2 .who { font-family: var(--body); font-size: 14px; color: var(--dim); display: block; font-weight: 700; margin-bottom: 2px; }
  .card .wh { display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; align-items: flex-end; }
  .card .wh .t { --w: min(24px, calc((100vw - 60px) / 16)); }
  .card .wh .gap { width: 6px; }
  .yl { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; text-align: left; font-size: 14px; max-width: 280px; margin: 0 auto; width: 100%; }
  .yl span:nth-child(2n) { text-align: right; font-family: var(--num); color: var(--gold); }
  .pts { font-family: var(--num); font-size: 30px; font-weight: 700; }
  .pts small { font-family: var(--body); font-size: 13px; color: var(--dim); display: block; font-weight: 700; }
  .delta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 11px; }
  .delta div { background: var(--felt-in); border-radius: 8px; padding: 6px 2px; }
  .delta b { display: block; font: 700 14px var(--num); }
  .delta .plus { color: #7fe0a8; } .delta .minus { color: var(--red); }
  .card .go { font: 900 15px var(--body); border: none; border-radius: 12px; padding: 12px; background: var(--gold); color: #1b1b1b; cursor: pointer; }
  .card p { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.7; }
  .rank { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; text-align: left; font-size: 15px; align-items: center; }
  .rank .p { font-family: var(--num); font-weight: 700; text-align: right; }
  .rules { text-align: left; font-size: 13px; line-height: 1.75; color: var(--ink); background: var(--felt-in); border-radius: 12px; padding: 10px 12px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <span><b id="round">東1局</b>　<span id="honba">0本場</span>　残り<span id="left">70</span></span>
    <span class="dora">ドラ表示 <span id="dora" style="display:flex;gap:2px"></span></span>
    <button type="button" class="speed" id="speed">速度 ふつう</button>
  </div>
  <div class="opps" id="opps"></div>
  <div class="table" id="table"></div>
  <div class="me">
    <div class="mymelds" id="mymelds"></div>
    <div class="hand" id="hand"></div>
    <div class="actions" id="actions"></div>
  </div>
</main>

<div class="modal" id="modal" hidden><div class="card" id="card"></div></div>

<script>
// ===== CORE START =====
const MJ = (() => {
  // kinds: 0-8 萬, 9-17 筒, 18-26 索, 27 東 28 南 29 西 30 北, 31 白 32 發 33 中
  const isHonor = k => k >= 27;
  const isTerm = k => k < 27 && (k % 9 === 0 || k % 9 === 8);
  const isYao = k => isHonor(k) || isTerm(k);
  const suit = k => k < 27 ? Math.floor(k / 9) : 3;
  const num = k => k % 9;
  const doraOf = k => k < 27 ? (k % 9 === 8 ? k - 8 : k + 1) : k <= 30 ? (k === 30 ? 27 : k + 1) : (k === 33 ? 31 : k + 1);
  const YAKU_NAMES = {};

  // ---------- shanten ----------
  const memo = new Map();
  function shantenNormal(c, openMelds) {
    const key = c.join('') + openMelds;
    const hit = memo.get(key); if (hit !== undefined) return hit;
    let min = 8;
    const cc = c.slice();
    const rec = (i, m, t, p) => {
      while (i < 34 && !cc[i]) i++;
      if (i >= 34) {
        const mm = m + openMelds; let tt = t;
        if (mm + tt > 4) tt = 4 - mm;
        const s = 8 - 2 * mm - tt - p;
        if (s < min) min = s;
        return;
      }
      if (cc[i] >= 3) { cc[i] -= 3; rec(i, m + 1, t, p); cc[i] += 3; }
      if (i < 27 && i % 9 <= 6 && cc[i + 1] && cc[i + 2]) { cc[i]--; cc[i + 1]--; cc[i + 2]--; rec(i, m + 1, t, p); cc[i]++; cc[i + 1]++; cc[i + 2]++; }
      if (!p && cc[i] >= 2) { cc[i] -= 2; rec(i, m, t, 1); cc[i] += 2; }
      if (cc[i] >= 2) { cc[i] -= 2; rec(i, m, t + 1, p); cc[i] += 2; }
      if (i < 27 && i % 9 <= 7 && cc[i + 1]) { cc[i]--; cc[i + 1]--; rec(i, m, t + 1, p); cc[i]++; cc[i + 1]++; }
      if (i < 27 && i % 9 <= 6 && cc[i + 2]) { cc[i]--; cc[i + 2]--; rec(i, m, t + 1, p); cc[i]++; cc[i + 2]++; }
      cc[i]--; rec(i, m, t, p); cc[i]++;
    };
    rec(0, 0, 0, 0);
    if (memo.size > 200000) memo.clear();
    memo.set(key, min);
    return min;
  }
  function shantenChiitoi(c) {
    let pairs = 0, kinds = 0;
    for (let i = 0; i < 34; i++) if (c[i]) { kinds++; if (c[i] >= 2) pairs++; }
    return 6 - pairs + Math.max(0, 7 - kinds);
  }
  const YAO = [0, 8, 9, 17, 18, 26, 27, 28, 29, 30, 31, 32, 33];
  function shantenKokushi(c) {
    let k = 0, pair = 0;
    for (const i of YAO) if (c[i]) { k++; if (c[i] >= 2) pair = 1; }
    return 13 - k - pair;
  }
  function shanten(c, openMelds) {
    let s = shantenNormal(c, openMelds);
    if (!openMelds) s = Math.min(s, shantenChiitoi(c), shantenKokushi(c));
    return s;
  }
  function waits(c, openMelds) {
    const out = [];
    for (let k = 0; k < 34; k++) {
      if (c[k] >= 4) continue;
      c[k]++;
      if (shanten(c, openMelds) === -1) out.push(k);
      c[k]--;
    }
    return out;
  }

  // ---------- decomposition ----------
  function decompose(c, need) {
    const res = [];
    const cc = c.slice();
    for (let p = 0; p < 34; p++) {
      if (cc[p] < 2) continue;
      cc[p] -= 2;
      const sets = [];
      (function rec(i) {
        while (i < 34 && !cc[i]) i++;
        if (i >= 34) { if (sets.length === need) res.push({ pair: p, sets: sets.slice() }); return; }
        if (cc[i] >= 3) { cc[i] -= 3; sets.push({ t: 'k', k: i }); rec(i); sets.pop(); cc[i] += 3; }
        if (i < 27 && i % 9 <= 6 && cc[i + 1] && cc[i + 2]) { cc[i]--; cc[i + 1]--; cc[i + 2]--; sets.push({ t: 's', k: i }); rec(i); sets.pop(); cc[i]++; cc[i + 1]++; cc[i + 2]++; }
      })(0);
      cc[p] += 2;
    }
    return res;
  }

  // ---------- scoring ----------
  const ceil100 = x => Math.ceil(x / 100) * 100;
  function limitName(han, base, yakuman) {
    if (yakuman) return yakuman > 1 ? `${yakuman}倍役満` : '役満';
    if (han >= 11) return '三倍満'; if (han >= 8) return '倍満'; if (han >= 6) return '跳満';
    if (han >= 5 || base >= 2000) return '満貫';
    return '';
  }
  function basePoints(han, fu, yakuman) {
    if (yakuman) return 8000 * yakuman;
    if (han >= 13) return 8000; if (han >= 11) return 6000; if (han >= 8) return 4000; if (han >= 6) return 3000;
    const b = fu * Math.pow(2, han + 2);
    return han >= 5 || b > 2000 ? 2000 : b;
  }

  /*
   ctx = {
     hand: counts[34] of concealed tiles INCLUDING the winning tile,
     melds: [{type:'chi'|'pon'|'minkan'|'ankan'|'kakan', k}], (chi: k = lowest tile)
     win: kind, tsumo: bool, riichi, ippatsu, doubleRiichi,
     seatWind: 27..30, roundWind: 27..30, dealer: bool,
     haitei, houtei, rinshan, chankan,
     doraInd: [kinds], uraInd: [kinds], aka: number
   }
  */
  function evaluate(ctx) {
    const { hand, melds, win } = ctx;
    const menzen = melds.every(m => m.type === 'ankan');
    const allCounts = hand.slice();
    for (const m of melds) {
      if (m.type === 'chi') { allCounts[m.k]++; allCounts[m.k + 1]++; allCounts[m.k + 2]++; }
      else allCounts[m.k] += m.type === 'pon' ? 3 : 4;
    }
    const candidates = [];
    const commonYaku = () => {
      const y = [];
      if (ctx.doubleRiichi) y.push(['ダブル立直', 2]); else if (ctx.riichi) y.push(['立直', 1]);
      if (ctx.ippatsu) y.push(['一発', 1]);
      if (menzen && ctx.tsumo) y.push(['門前清自摸和', 1]);
      if (ctx.haitei) y.push(['海底摸月', 1]);
      if (ctx.houtei) y.push(['河底撈魚', 1]);
      if (ctx.rinshan) y.push(['嶺上開花', 1]);
      if (ctx.chankan) y.push(['槍槓', 1]);
      return y;
    };
    const tiles = []; for (let k = 0; k < 34; k++) for (let n = 0; n < allCounts[k]; n++) tiles.push(k);
    const allSimple = tiles.every(k => !isYao(k));
    const suits = new Set(tiles.map(suit));
    const hasHonor = suits.has(3);
    const numSuits = [...suits].filter(s => s < 3);

    // ---- yakuman independent of shape
    const ykm = [];
    if (tiles.every(isHonor)) ykm.push(['字一色', 1]);
    if (tiles.every(k => [19, 20, 21, 23, 25, 32].includes(k))) ykm.push(['緑一色', 1]);
    if (tiles.every(isTerm)) ykm.push(['清老頭', 1]);
    const kanCount = melds.filter(m => m.type !== 'chi' && m.type !== 'pon').length;
    if (kanCount === 4) ykm.push(['四槓子', 1]);

    // ---- kokushi
    if (!melds.length && shantenKokushi(hand) === -1) {
      candidates.push({ yaku: [['国士無双', 1], ...ykm], yakuman: true, fu: 0 });
    }
    // ---- chiitoitsu
    if (!melds.length && shantenChiitoi(hand) === -1) {
      const y = commonYaku();
      y.push(['七対子', 2]);
      if (allSimple) y.push(['断么九', 1]);
      if (tiles.every(isYao)) y.push(['混老頭', 2]);
      if (numSuits.length === 1) y.push(hasHonor ? ['混一色', 3] : ['清一色', 6]);
      candidates.push({ yaku: y, fu: 25, ykm: ykm.slice() });
    }
    // ---- standard
    const need = 4 - melds.length;
    for (const d of decompose(hand, need)) {
      // winning-tile placements
      const places = [];
      if (d.pair === win) places.push({ wait: 'tanki', idx: -1 });
      d.sets.forEach((s, idx) => {
        if (s.t === 'k' && s.k === win) places.push({ wait: 'shanpon', idx });
        if (s.t === 's' && win >= s.k && win <= s.k + 2) {
          let w = 'ryanmen';
          if (win === s.k + 1) w = 'kanchan';
          else if (win === s.k + 2 && s.k % 9 === 0) w = 'penchan';
          else if (win === s.k && s.k % 9 === 6) w = 'penchan';
          places.push({ wait: w, idx });
        }
      });
      for (const pl of places) {
        const sets = [
          ...d.sets.map((s, idx) => ({ t: s.t, k: s.k, closed: !(idx === pl.idx && s.t === 'k' && !ctx.tsumo), kan: false })),
          ...melds.map(m => ({ t: m.type === 'chi' ? 's' : 'k', k: m.k, closed: m.type === 'ankan', kan: m.type !== 'chi' && m.type !== 'pon' }))
        ];
        const shun = sets.filter(s => s.t === 's'), kou = sets.filter(s => s.t === 'k');
        const pair = d.pair;
        const yakuhaiPair = pair >= 31 || pair === ctx.seatWind || pair === ctx.roundWind;
        const y = commonYaku();
        const ym = ykm.slice();
        // yakuman
        const ankou = kou.filter(s => s.closed).length;
        if (ankou === 4) ym.push([pl.wait === 'tanki' ? '四暗刻単騎' : '四暗刻', 1]);
        const dragonsK = kou.filter(s => s.k >= 31).length;
        if (dragonsK === 3) ym.push(['大三元', 1]);
        const windK = kou.filter(s => s.k >= 27 && s.k <= 30).length;
        if (windK === 4) ym.push(['大四喜', 1]);
        else if (windK === 3 && pair >= 27 && pair <= 30) ym.push(['小四喜', 1]);
        if (menzen && numSuits.length === 1 && !hasHonor) {
          const base = [3, 1, 1, 1, 1, 1, 1, 1, 3], st = numSuits[0] * 9;
          if (base.every((n, i) => allCounts[st + i] >= n)) ym.push(['九蓮宝燈', 1]);
        }
        if (ym.length) { candidates.push({ yaku: ym, yakuman: true, fu: 0 }); continue; }

        const pinfu = menzen && shun.length === 4 && !yakuhaiPair && pl.wait === 'ryanmen';
        if (pinfu) y.push(['平和', 1]);
        if (allSimple) y.push(['断么九', 1]);
        // peikou
        if (menzen) {
          const cnt = {}; shun.forEach(s => cnt[s.k] = (cnt[s.k] || 0) + 1);
          const pk = Object.values(cnt).reduce((a, n) => a + Math.floor(n / 2), 0);
          if (pk === 2) y.push(['二盃口', 3]); else if (pk === 1) y.push(['一盃口', 1]);
        }
        // yakuhai
        for (const s of kou) {
          if (s.k === 31) y.push(['役牌 白', 1]);
          if (s.k === 32) y.push(['役牌 發', 1]);
          if (s.k === 33) y.push(['役牌 中', 1]);
          if (s.k === ctx.seatWind) y.push(['自風 ' + '東南西北'[s.k - 27], 1]);
          if (s.k === ctx.roundWind) y.push(['場風 ' + '東南西北'[s.k - 27], 1]);
        }
        const o = menzen ? 0 : 1;
        // sanshoku / ittsu
        for (let n = 0; n < 7; n++) if ([0, 1, 2].every(su => shun.some(s => s.k === su * 9 + n))) { y.push(['三色同順', 2 - o]); break; }

            out.push({ type: 'chi', use: [ta, tb], low: tile.k + lo });
          }
        }
      }
    }
    // ron
    const tmp = { ...p, hand: p.hand.concat([tile]) };
    const w = winInfo(tmp, tile, false, { houtei: H.wall.length === 0, chankan: !!H.chankanFlag });
    if (w && !isFuriten(p)) out.unshift({ type: 'ron', info: w });
    return out;
  }

  // ---------- human interaction ----------
  function humanSelf(p, opts) {
    return new Promise(resolve => {
      clearUI();
      const all = () => p.hand.concat(p.drawn ? [p.drawn] : []);
      const setBase = () => {
        clearUI();
        ui.hint = '';
        if (opts.tsumo) ui.buttons.push({ label: 'ツモ', cls: 'ron', fn: () => resolve({ type: 'tsumo' }) });
        if (opts.riichi.length) ui.buttons.push({ label: 'リーチ', fn: startRiichi });
        for (const k of opts.ankan) ui.buttons.push({ label: `カン ${tileHTML({ k })}`, fn: () => resolve({ type: 'ankan', k }) });
        for (const k of opts.kakan) ui.buttons.push({ label: `加槓 ${tileHTML({ k })}`, fn: () => resolve({ type: 'kakan', k }) });
        if (p.riichi) {
          ui.selectable = t => t === p.drawn;
          if (!ui.buttons.length) { setTimeout(() => resolve({ type: 'discard', tile: p.drawn }), SPEEDS[speedIdx][1]); ui.hint = 'リーチ中：自動でツモ切り'; }
          else ui.buttons.push({ label: 'ツモ切り', cls: 'sub', fn: () => resolve({ type: 'discard', tile: p.drawn }) });
        }
        if (!p.riichi || ui.buttons.length) ui.hint = ui.hint || (ui.buttons.length ? '' : '捨てる牌を2回タップ');
        ui.onTile = t => resolve({ type: 'discard', tile: t });
        render();
      };
      const startRiichi = () => {
        clearUI();
        const ok = new Set(all().filter(t => opts.riichi.includes(t.k)).map(t => t.id));
        ui.tenpaiOk = ok;
        ui.selectable = t => ok.has(t.id);
        ui.hint = 'リーチ宣言牌を選ぶ';
        ui.buttons = [{ label: 'やめる', cls: 'sub', fn: setBase }];
        ui.onTile = t => resolve({ type: 'discard', tile: t, riichi: true });
        render();
      };
      setBase();
    });
  }
  function humanCall(p, opts, tile) {
    return new Promise(resolve => {
      clearUI();
      const chis = opts.filter(o => o.type === 'chi');
      for (const o of opts) {
        if (o.type === 'ron') ui.buttons.push({ label: 'ロン', cls: 'ron', fn: () => resolve(o) });
        if (o.type === 'pon') ui.buttons.push({ label: 'ポン', fn: () => resolve(o) });
        if (o.type === 'minkan') ui.buttons.push({ label: 'カン', fn: () => resolve(o) });
      }
      if (chis.length === 1) ui.buttons.push({ label: 'チー', fn: () => resolve(chis[0]) });
      else if (chis.length > 1) for (const o of chis) {
        const set = [...o.use, tile].sort((a, b) => a.k - b.k);
        ui.buttons.push({ label: `チー ${set.map(t => tileHTML(t)).join('')}`, fn: () => resolve(o) });
      }
      ui.buttons.push({ label: 'スキップ', cls: 'sub', fn: () => resolve(null) });
      ui.hint = '';
      render();
    });
  }

  // ---------- core flow ----------
  function drawTile(p, rinshan) {
    let t;
    if (rinshan) { t = H.dead[H.rinshanUsed++]; H.wall.shift(); } // keep live count consistent
    else t = H.wall.pop();
    p.drawn = t;
    return t;
  }
  function discard(p, t, riichi) {
    if (p.drawn && t !== p.drawn) { p.hand.push(p.drawn); }
    if (p.drawn || t !== p.drawn) p.hand = p.hand.filter(x => x !== t);
    p.drawn = null;
    sortHand(p.hand);
    if (p.ippatsu && !riichi) p.ippatsu = false;
    const r = { tile: t, riichi: !!riichi, called: false };
    p.river.push(r); p.discards.add(t.k);
    if (p.furitenTemp) p.furitenTemp = false;
    H.lastDiscard = { tile: t, seat: p.seat, rec: r };
    click();
    return r;
  }
  function cancelIppatsu() { H.players.forEach(p => p.ippatsu = false); }

  async function playHand() {
    newHand();
    let cur = G.dealer, needDraw = true, rinshan = false;
    H.turn = cur; clearUI(); render();
    await sleep(400);
    while (true) {
      const p = H.players[cur];
      H.turn = cur;
      if (needDraw) {
        if (H.wall.length === 0) return ryuukyoku();
        drawTile(p, rinshan);
        H.rinshanFlag = rinshan;
      }
      rinshan = false;
      render();
      // self action
      let act;
      const opts = needDraw ? selfOptions(p) : { tsumo: null, riichi: [], ankan: [], kakan: [] };
      if (!needDraw) {
        // after a call: must discard, no riichi
        p.hand.push(...(p.drawn ? [p.drawn] : [])); p.drawn = null;
      }
      if (p.seat === 0) act = await humanSelf(p, opts);
      else {
        await delay();
        act = cpuSelf(p, opts);
      }
      clearUI();
      if (act.type === 'tsumo') { const wt = p.drawn; p.hand.push(wt); p.drawn = null; return settleWin(p, null, opts.tsumo, wt); }
      if (act.type === 'ankan' || act.type === 'kakan') {
        const all = p.hand.concat(p.drawn ? [p.drawn] : []); p.drawn = null;
        if (act.type === 'ankan') {
          const use = all.filter(t => t.k === act.k);
          p.hand = all.filter(t => t.k !== act.k);
          p.melds.push({ type: 'ankan', k: act.k, tiles: use });
        } else {
          const t = all.find(x => x.k === act.k);
          p.hand = all.filter(x => x !== t);
          const m = p.melds.find(x => x.type === 'pon' && x.k === act.k);
          // chankan check
          H.chankanFlag = true;
          for (let i = 1; i < 4; i++) {
            const o = H.players[(cur + i) % 4];
            const tmp = { ...o, hand: o.hand.concat([t]) };
            const w = winInfo(tmp, t, false, { chankan: true });
            if (w && !isFuriten(o)) {
              const take = o.seat === 0 ? await humanCall(o, [{ type: 'ron', info: w }], t) : { type: 'ron' };
              if (take) { H.chankanFlag = false; o.hand.push(t); return settleWin(o, p, w, t); }
            }
          }
          H.chankanFlag = false;
          m.type = 'kakan'; m.tiles.push(t);
        }
        sortHand(p.hand);
        H.kans++; H.doraCount = Math.min(5, H.doraCount + 1);
        cancelIppatsu(); click(900, 0.14);
        needDraw = true; rinshan = true;
        render(); await sleep(250);
        continue;
      }
      // discard
      const rec = discard(p, act.tile, act.riichi);
      if (act.riichi) { p.riichiPending = true; }
      render();
      // reactions
      const tile = act.tile;
      let taken = null;
      // ron (head bump: first in turn order)
      for (let i = 1; i < 4 && !taken; i++) {
        const o = H.players[(cur + i) % 4];
        const opts2 = callOptions(o, tile, cur);
        const ron = opts2.find(x => x.type === 'ron');
        if (!ron) {
          // missed-ron furiten if the tile is among waits but no yaku/furiten handled by isFuriten
          continue;
        }
        let choice;
        if (o.seat === 0) choice = await humanCall(o, [ron], tile);
        else choice = ron;
        if (choice) taken = { o, choice };
        else { o.furitenTemp = true; if (o.riichi) o.furitenRiichi = true; }
      }
      if (taken) {
        taken.o.hand.push(tile); rec.called = true;
        return settleWin(taken.o, p, taken.choice.info, tile);
      }
      // riichi established
      if (p.riichiPending) {
        p.riichiPending = false; p.riichi = true; p.ippatsu = true;
        G.points[p.seat] -= 1000; G.sticks++;
        click(2200, 0.12);
        render();
      }
      // pon / kan / chi
      let call = null, humanAsked = false;
      for (let i = 1; i < 4 && !call; i++) {
        const o = H.players[(cur + i) % 4];
        const opts2 = callOptions(o, tile, cur).filter(x => x.type !== 'ron');
        const big = opts2.filter(x => x.type === 'pon' || x.type === 'minkan');
        if (!big.length) continue;
        if (o.seat === 0) {
          const withChi = (cur + 1) % 4 === 0 ? opts2 : big;
          humanAsked = true;
          const ch = await humanCall(o, withChi, tile);
          if (ch) call = { o, ch };
        } else {
          const pon = big.find(x => x.type === 'pon');
          if (pon && cpuWantsCall(o, pon, tile)) call = { o, ch: pon };
        }
      }
      if (!call) {
        const nx = H.players[(cur + 1) % 4];
        const chis = callOptions(nx, tile, cur).filter(x => x.type === 'chi');
        if (chis.length) {
          if (nx.seat === 0) { if (!humanAsked) { const ch = await humanCall(nx, chis, tile); if (ch) call = { o: nx, ch }; } }
          else { const ch = chis.find(x => cpuWantsCall(nx, x, tile)); if (ch) call = { o: nx, ch }; }
        }
      }
      clearUI();
      if (call) {
        const { o, ch } = call;
        rec.called = true; cancelIppatsu();
        o.hand = o.hand.filter(t => !ch.use.includes(t));
        const tiles = [...ch.use, tile].sort((a, b) => a.k - b.k);
        o.melds.push({ type: ch.type === 'minkan' ? 'minkan' : ch.type, k: ch.type === 'chi' ? ch.low : tile.k, tiles, from: cur });
        click(700, 0.16);
        cur = o.seat;
        if (ch.type === 'minkan') { H.kans++; H.doraCount = Math.min(5, H.doraCount + 1); needDraw = true; rinshan = true; }
        else needDraw = false;
        render(); await sleep(300);
        continue;
      }
      cur = (cur + 1) % 4; needDraw = true;
      H.firstRound = false;
    }
  }

  function cpuSelf(p, opts) {
    if (opts.tsumo) return { type: 'tsumo' };
    if (opts.ankan.length && !p.riichi) {
      const k = opts.ankan[0];
      const all = p.hand.concat(p.drawn ? [p.drawn] : []);
      const c = counts(all), before = MJ.shanten(c, openCount(p));
      c[k] -= 4;
      // compare with discarding one of them
      if (MJ.shantenNormal(c, openCount(p) + 1) <= before) return { type: 'ankan', k };
    }
    if (opts.ankan.length && p.riichi) return { type: 'ankan', k: opts.ankan[0] };
    const t = cpuChooseDiscard(p);
    if (opts.riichi.includes(t.k)) return { type: 'discard', tile: t, riichi: true };
    return { type: 'discard', tile: t };
  }

  // ---------- settlement ----------
  function settleWin(winner, loser, info, winTile) {
    const dealerWin = winner.seat === G.dealer;
    const delta = [0, 0, 0, 0];
    const honba = G.honba;
    if (!loser) {
      if (dealerWin) for (let s = 0; s < 4; s++) { if (s !== winner.seat) { delta[s] -= info.payAll + honba * 100; delta[winner.seat] += info.payAll + honba * 100; } }
      else for (let s = 0; s < 4; s++) if (s !== winner.seat) {
        const pay = (s === G.dealer ? info.payDealer : info.payChild) + honba * 100;
        delta[s] -= pay; delta[winner.seat] += pay;
      }
    } else {
      const pay = info.total + honba * 300;
      delta[loser.seat] -= pay; delta[winner.seat] += pay;
    }
    delta[winner.seat] += G.sticks * 1000;
    G.sticks = 0;
    for (let s = 0; s < 4; s++) G.points[s] += delta[s];
    H.result = { type: 'win', winner, loser, info, winTile, delta };
    chime();
    if (dealerWin) G.honba++;
    else { G.honba = 0; G.dealer = (G.dealer + 1) % 4; G.round++; }
    return H.result;
  }

  function ryuukyoku() {
    const tenpai = H.players.map(p => MJ.shanten(counts(p.hand), openCount(p)) === 0);
    const n = tenpai.filter(Boolean).length;
    const delta = [0, 0, 0, 0];
    if (n > 0 && n < 4) for (let s = 0; s < 4; s++) delta[s] = tenpai[s] ? 3000 / n : -3000 / (4 - n);
    for (let s = 0; s < 4; s++) G.points[s] += delta[s];
    H.result = { type: 'draw', tenpai, delta };
    G.honba++;
    if (!tenpai[G.dealer]) { G.dealer = (G.dealer + 1) % 4; G.round++; }
    return H.result;
  }

  // ---------- result screens ----------
  function deltaHTML(delta) {
    return `<div class="delta">${[0, 1, 2, 3].map(s => `<div>${SHORT[s]}<b class="${delta[s] > 0 ? 'plus' : delta[s] < 0 ? 'minus' : ''}">${delta[s] > 0 ? '+' : ''}${delta[s] || '±0'}</b>${G.points[s]}</div>`).join('')}</div>`;
  }
  function showResult(res) {
    return new Promise(resolve => {
      let h = '';
      if (res.type === 'win') {
        const { winner, loser, info, winTile } = res;
        const hand = winner.hand.filter(t => t !== winTile);
        sortHand(hand);
        const melds = winner.melds.map(m => m.tiles.map(t => tileHTML(t)).join('')).join('<span class="gap"></span>');
        const how = loser ? `ロン（${SHORT[loser.seat]}から）` : 'ツモ';
        h += `<h2><span class="who">${NAMES[winner.seat]}の和了・${how}</span>${info.limit || `${info.han}翻${info.fu}符`}</h2>`;
        h += `<div class="wh">${hand.map(t => tileHTML(t)).join('')}<span class="gap"></span>${tileHTML(winTile, 'hl')}${melds ? '<span class="gap"></span>' + melds : ''}</div>`;
        h += `<div class="yl">${info.yaku.map(([n, v]) => `<span>${n}</span><span>${typeof v === 'number' ? v + '翻' : v}</span>`).join('')}</div>`;
        h += `<div class="pts">${info.yakuman ? '' : `${info.han}翻${info.fu}符　`}${info.label}<small>${winner.seat === G.dealer && !loser ? '' : ''}ドラ表示 ${doraInd().map(k => tileHTML({ k })).join('')}${winner.riichi ? '　裏 ' + uraInd().map(k => tileHTML({ k })).join('') : ''}</small></div>`;
      } else {
        h += `<h2><span class="who">山がなくなりました</span>流局</h2>`;
        h += `<p>${[0, 1, 2, 3].map(s => `${SHORT[s]}：${res.tenpai[s] ? '<b style="color:var(--gold)">聴牌</b>' : 'ノーテン'}`).join('　')}</p>`;
        if (res.tenpai[0]) {
          const w = MJ.waits(counts(H.players[0].hand), openCount(H.players[0]));
          h += `<p>あなたの待ち</p><div class="wh">${w.map(k => tileHTML({ k })).join('')}</div>`;
        }
      }
      h += deltaHTML(res.delta);
      h += `<button type="button" class="go" id="nextBtn">次へ</button>`;
      $('card').innerHTML = h;
      $('modal').hidden = false;
      $('nextBtn').addEventListener('click', () => { $('modal').hidden = true; resolve(); });
    });
  }

  function gameEnded() {
    if (G.points.some(p => p < 0)) return 'トビ終了';
    if (G.round >= 4) return '東風戦終了';
    return null;
  }

  function showFinal(reason) {
    const order = [0, 1, 2, 3].sort((a, b) => G.points[b] - G.points[a] || ((a - G.startDealer + 4) % 4) - ((b - G.startDealer + 4) % 4));
    const myRank = order.indexOf(0) + 1;
    const rec = store.get('mj.rec', { games: 0, ranks: [0, 0, 0, 0], best: -1e9 });
    rec.games++; rec.ranks[myRank - 1]++; rec.best = Math.max(rec.best, G.points[0]);
    store.set('mj.rec', rec);
    const avg = (rec.ranks.reduce((a, n, i) => a + n * (i + 1), 0) / rec.games).toFixed(2);
    $('card').innerHTML = `<h2><span class="who">${reason}</span>${myRank}位</h2>
      <div class="rank">${order.map((s, i) => `<span>${i + 1}位</span><span>${NAMES[s]}</span><span class="p">${G.points[s]}</span>`).join('')}</div>
      <p>通算 ${rec.games}戦　1位 ${rec.ranks[0]}回・平均順位 ${avg}　最高 ${rec.best}点</p>
      <button type="button" class="go" id="againBtn">もう一局</button>`;
    $('modal').hidden = false;
    $('againBtn').addEventListener('click', () => { $('modal').hidden = true; run(); });
  }

  async function run() {
    newGame();
    while (true) {
      const res = await playHand();
      render();
      await sleep(500);
      await showResult(res);
      const end = gameEnded();
      if (end) return showFinal(end);
    }
  }

  function intro() {
    $('card').innerHTML = `<h2><span class="who">CPU 3人と対局</span>四人麻雀</h2>
      <div class="rules">
        ・東風戦（東1〜4局）、持ち点25000、赤ドラあり、喰いタンあり<br>
        ・捨てる牌は<b>2回タップ</b>（1回目で持ち上げ、2回目で捨てる）<br>
        ・ツモ・リーチ・ポン・チー・カン・ロンは下にボタンが出ます<br>
        ・リーチすると以降は自動でツモ切り。役がないと和了れません<br>
        ・右上の「速度」でCPUの打牌スピードを変更
      </div>
      <button type="button" class="go" id="startBtn">対局開始</button>`;
    $('modal').hidden = false;
    $('startBtn').addEventListener('click', () => { $('modal').hidden = true; click(); run(); });
  }

  // show an empty table behind the intro
  newGame(); newHand(); render();
  intro();
})();
</script>

</body>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>脱出パーキング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #2b2f36;
    --asphalt: #3a3f48;
    --asphalt-hi: #434953;
    --paint: #f4efe2;
    --stripe: #f2c230;
    --ink: #f4efe2;
    --dim: #a9afba;
    --red: #e8453c;
    --panel: #22262c;
    --display: "RocknRoll One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body);
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 460px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 28px;
    display: flex; flex-direction: column; gap: 16px;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: 0.02em; }
  .lvl { font-family: var(--display); font-size: 15px; color: var(--stripe); }
  .counts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .count { background: var(--panel); border-radius: 14px; padding: 10px 14px; display: flex; align-items: baseline; justify-content: space-between; }
  .count span { font-size: 12px; font-weight: 700; color: var(--dim); letter-spacing: 0.08em; }
  .count b { font-family: var(--display); font-weight: 400; font-size: 26px; font-variant-numeric: tabular-nums; }

  .lot { position: relative; padding: 10px; background: var(--panel); border-radius: 18px; }
  .board {
    position: relative; width: 100%; aspect-ratio: 1; max-width: 100%;
    background:
      repeating-linear-gradient(90deg, transparent 0 calc(100% / 6 - 1px), rgba(244,239,226,0.08) calc(100% / 6 - 1px) calc(100% / 6)),
      repeating-linear-gradient(0deg, transparent 0 calc(100% / 6 - 1px), rgba(244,239,226,0.08) calc(100% / 6 - 1px) calc(100% / 6)),
      var(--asphalt);
    border-radius: 8px; touch-action: none; overflow: visible;
  }
  .exit {
    position: absolute; right: -10px; top: calc(100% / 6 * 2); height: calc(100% / 6); width: 10px;
    background: var(--asphalt);
  }
  .exit::after {
    content: "EXIT"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%) rotate(90deg);
    font: 400 11px var(--display); color: var(--stripe); letter-spacing: 0.1em;
  }
  .exit-arrow { position: absolute; right: 3%; top: calc(100% / 6 * 2.5); transform: translateY(-50%); width: 7%; opacity: 0.35; }

  .car {
    position: absolute; left: 0; top: 0; padding: 1.1%; box-sizing: border-box; cursor: grab;
    transition: transform 0.16s cubic-bezier(.2,.8,.3,1);
  }
  .car.dragging { transition: none; cursor: grabbing; z-index: 3; }
  .car .body {
    position: relative; width: 100%; height: 100%; border-radius: 22% / 30%;
    background: var(--c); box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2), 0 4px 8px rgba(0,0,0,0.35);
  }
  .car.v .body { border-radius: 30% / 22%; }
  .car .body::before, .car .body::after { content: ""; position: absolute; background: rgba(20, 28, 40, 0.55); border-radius: 4px; }
  /* windshield + rear window */
  .car.h .body::before { top: 16%; bottom: 16%; right: 16%; width: 13%; }
  .car.h .body::after  { top: 20%; bottom: 20%; left: 12%; width: 9%; }
  .car.v .body::before { left: 16%; right: 16%; bottom: 16%; height: 13%; }
  .car.v .body::after  { left: 20%; right: 20%; top: 12%; height: 9%; }
  .car .roof { position: absolute; inset: 30%; border-radius: 4px; background: rgba(255,255,255,0.18); }
  .car.len3.h .roof { inset: 28% 34% 28% 22%; }
  .car.len3.v .roof { inset: 22% 28% 34% 28%; }
  .car.target .body { background: var(--red); }
  .car.target .roof::after { content: "★"; position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,0.75); font-size: 14px; }
  .car.hint .body { outline: 3px solid var(--stripe); outline-offset: 2px; animation: pulse 0.6s ease-in-out 3; }
  @keyframes pulse { 50% { outline-offset: 6px; } }
  .ghost { position: absolute; left: 0; top: 0; padding: 1.1%; box-sizing: border-box; pointer-events: none; }
  .ghost div { width: 100%; height: 100%; border: 2.5px dashed var(--stripe); border-radius: 18%; }
  .car.leave { transition: transform 0.6s cubic-bezier(.5,0,.8,.4); }

  .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  button {
    font: 700 13px var(--body); color: var(--ink); background: var(--panel); border: none; border-radius: 14px;
    padding: 12px 0; cursor: pointer; box-shadow: 0 3px 0 #16191d;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #16191d; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--stripe); outline-offset: 2px; }
  .hintnote { min-height: 20px; font-size: 13px; color: var(--dim); text-align: center; }

  .overlay {
    position: fixed; inset: 0; z-index: 10; background: rgba(20, 23, 28, 0.88);
    display: flex; align-items: center; justify-content: center; padding-inline: 16px;
  }
  .sheet { width: 100%; max-width: 420px; max-height: 88vh; overflow-y: auto; background: var(--bg); border-radius: 20px; padding: 22px 18px; display: flex; flex-direction: column; gap: 14px; }
  .sheet h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; text-align: center; }
  .sheet p { margin: 0; color: var(--dim); text-align: center; font-size: 14px; line-height: 1.6; }
  .stars { text-align: center; font-size: 40px; letter-spacing: 6px; color: var(--stripe); }
  .stars .off { color: #555c68; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .primary { background: var(--stripe); color: #2b2f36; box-shadow: 0 3px 0 #9c7c16; }

  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .grid button { padding: 10px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 400 18px var(--display); }
  .grid button small { font: 700 10px var(--body); color: var(--stripe); letter-spacing: 1px; min-height: 12px; }
  .grid button.cur { outline: 2px solid var(--stripe); }
  .tier { font-size: 12px; font-weight: 700; color: var(--dim); letter-spacing: 0.1em; margin-top: 4px; }
  @media (prefers-reduced-motion: reduce) { .car { transition: none; } .car.hint .body { animation: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>脱出パーキング</h1>
    <div class="lvl" id="lvl">LEVEL 1</div>
  </header>

  <div class="counts">
    <div class="count"><span>手数</span><b id="moves">0</b></div>
    <div class="count"><span>最短</span><b id="best">3</b></div>
  </div>

  <div class="lot">
    <div class="board" id="board">
      <div class="exit"></div>
      <svg class="exit-arrow" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M10 5l5 5-5 5" stroke="#f2c230" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <div class="hintnote" id="note">赤い車を右の出口まで出そう。車は向きに沿ってドラッグで動かせる。</div>

  <div class="tools">
    <button id="undo" type="button">戻す</button>
    <button id="reset" type="button">やり直し</button>
    <button id="hint" type="button">ヒント</button>
    <button id="menu" type="button">ステージ</button>
  </div>
</main>

<div class="overlay" id="win" hidden>
  <div class="sheet">
    <h2 id="winTitle">脱出成功！</h2>
    <div class="stars" id="stars">★★★</div>
    <p id="winText">8 手（最短 8 手）</p>
    <div class="row2">
      <button id="retry" type="button">もう一度</button>
      <button id="next" class="primary" type="button">次へ</button>
    </div>
  </div>
</div>

<div class="overlay" id="select" hidden>
  <div class="sheet">
    <h2>ステージ</h2>
    <p id="selInfo">★ 0 / 120</p>
    <div id="grid"></div>
    <button id="selClose" type="button">閉じる</button>
  </div>
</div>

<script>
(() => {
  const LEVELS = [["BC..DDBCEFGGAAEF..HIJJK.HILLKMNN.OOM", 3], ["BCDD..BCEFGGAAEF..HIJJK.HILLKMNN.OOM", 4], ["BCDEEEBCDFFGHCAA.GHI..JJKILLLMK.NN.M", 5], [".BBCC..DDEEEFAA.GHF...GHII...JKKLLLJ", 5], ["BCDDEEBC.FF.AA...GHIJJKGHILLKMNN.OOM", 6], [".BCCDDEBFFGHEBAAGH..II.JKKLL.J.MMNNN", 6], ["BCDDEEBCFGHHAAFG.IJKLLMIJK..M.NN.OO.", 7], ["..BCCDEEBF.D.AAF.GHIIJKGHLMJK..LMNNN", 7], ["BCDDD.BCEE.FBCAAGFHHIIG.JKLMMNJKL..N", 8], [".BBC.D.EECFDAA.CF.G.HHIIG.JJKKGLLLMM", 8], [".B.CCC.BDEEFAAD.GFHI.JGKHILJGKHILMMK", 9], ["BB.CCC..DDE.F.AAEGFHHIIGFJJ.KK.LLMMM", 9], ["BCDDEEBCF.GGAAF..HIJKK.HIJLL.M.NNOOM", 10], ["BC.DEEBCFDGHAAF.GHIIJJ.K...LLKMM.NNN", 10], [".BB.C..DD.CEAA.FCEGHHFIIGJKLLM.JK..M", 11], ["BBCCD..EE.D.FAA..GF.HIIGJKHL.GJKHLMM", 11], ["BC.DDDBCE.FFAAEG.HII.G.HJ.KKKLJMMM.L", 12], [".BB.CCD.EEE.DAA..FDGHIIFJGHK.FJGHKLL", 12], ["BB..CCDDEEFG.HAAFGIHJKF.I.JKLL.MMNN.", 13], [".BCC.D.BEE.DF.AAGDFHHHG.FIIJKK.LLJMM", 13], ["..BC.D..BCEDAABFE....F.GH.IIJGHKK.JG", 14], [".BBCCCDDD..EFGAAHEFGI.HE..IJJJKKK...", 14], ["...BCCDE.BFGDEAAFGDHHHIJK..LIJK..LMM", 15], [".BBCCCDDD..EFGAAHEFGI.HE..IJJJKKK.LL", 15], ["BCDDEEBCFGHHAAFG...IJJK..ILLKM...NNM", 16], [".BBCCC.DDD.EFGAAHEFGI.HE..IJJJ.KKKLL", 16], [".BCDDE.BCFFEAAGH..I.GHJ.IKKLJ..MMLNN", 17], ["..B.CCDDBEE..FAAGHIF..GHIFJJJKLL.MMK", 17], ["B.CCDDB.EFGGAAEF..HIJJK.HILLKMNN.OOM", 18], ["BCDDEEBCFGHHAAFG..IJKKL.IJMMLNOO.PPN", 19], [".....BC.DDDBCEAAFBGEHHF.GEIJKKLLIJMM", 20], [".BBB.CD.EEECDFAAGCHFIIG.HFJKLLMMJKNN", 21], [".BCDDE.BCFFEAAG.H.IIGJHKLMMJ.KL..JNN", 22], ["BCC.D.BEE.DFAA.GDFHIIG..HJKLLM.JKNNM", 22], ["BCC.D.BEE.DFAA.GDF...GHHIJKLLMIJKNNM", 23], ["BBCDE.F.CDE.FAAGE..HIG.J.HIKKJ...LLJ", 24], ["BBCDE.F.CDE.FAAGE..HIG.J.HIKKJ.LLMMJ", 25], ["BBC..D..CEEDAAF...GGFHIJKLLHIJK..HMM", 26], ["BB..C..DDDCE.FAAGEHFI.GJH.IKKJ.LLMM.", 26], [".BBCC.DD.EF.GAAEFHG.IIIHG.JKKL..JMML", 27]];
  const N = 6;
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const COLORS = ['#3d8bfd', '#2fbf71', '#f29b30', '#a66cff', '#18b5c9', '#f06ba8', '#8fd14f', '#f2c230', '#6f7dff', '#ff8c61', '#48c9b0', '#c3a3ff', '#d9d24a', '#5aa0c8'];
  const TRUCKS = ['#8b6fd6', '#2f9e8f', '#c27b3a', '#4a78c9', '#b8567f'];

  let progress = store.get('pk.progress', {});   // { idx: bestMoves }
  let idx = store.get('pk.level', 0);
  let cars, grid, moves, history, won;
  const board = $('board');

  // ---------- model ----------
  function parse(s) {
    const map = {};
    for (let i = 0; i < 36; i++) { const ch = s[i]; if (ch !== '.') (map[ch] = map[ch] || []).push(i); }
    let ti = 0, ci = 0;
    return Object.keys(map).sort().map(id => {
      const cs = map[id], h = cs.length > 1 && cs[1] - cs[0] === 1;
      const col = id === 'A' ? null : cs.length === 3 ? TRUCKS[ti++ % TRUCKS.length] : COLORS[ci++ % COLORS.length];
      return { id, len: cs.length, h, r: Math.floor(cs[0] / N), c: cs[0] % N, col };
    });
  }
  function encode() {
    const a = Array(36).fill('.');
    for (const k of cars) for (let j = 0; j < k.len; j++) a[(k.r + (k.h ? 0 : j)) * N + k.c + (k.h ? j : 0)] = k.id;
    return a.join('');
  }
  function occ(except) {
    const g = Array(36).fill(false);
    for (const k of cars) if (k !== except) for (let j = 0; j < k.len; j++) g[(k.r + (k.h ? 0 : j)) * N + k.c + (k.h ? j : 0)] = true;
    return g;
  }
  function range(k) {
    const g = occ(k);
    let lo = 0, hi = 0;
    if (k.h) {
      while (k.c - lo - 1 >= 0 && !g[k.r * N + k.c - lo - 1]) lo++;
      while (k.c + k.len + hi < N && !g[k.r * N + k.c + k.len + hi]) hi++;
    } else {
      while (k.r - lo - 1 >= 0 && !g[(k.r - lo - 1) * N + k.c]) lo++;
      while (k.r + k.len + hi < N && !g[(k.r + k.len + hi) * N + k.c]) hi++;
    }
    return [-lo, hi];
  }

  // BFS over board strings; returns the first move of an optimal solution
  function solveFrom(start) {
    const goal = s => s[2 * N + 5] === 'A';
    if (goal(start)) return null;
    const prev = new Map([[start, null]]);
    const q = [start];
    for (let qi = 0; qi < q.length; qi++) {
      const s = q[qi];
      for (const [t, mv] of neighbors(s)) {
        if (prev.has(t)) continue;
        prev.set(t, [s, mv]);
        if (goal(t)) {
          let cur = t, first = null;
          while (prev.get(cur)) { first = prev.get(cur)[1]; cur = prev.get(cur)[0]; }
          return first;
        }
        q.push(t);
      }
      if (q.length > 400000) break;
    }
    return null;
  }
  function neighbors(s) {
    const out = [], seen = {};
    for (let i = 0; i < 36; i++) {
      const ch = s[i]; if (ch === '.' || seen[ch]) continue; seen[ch] = true;
      const h = (i % N) < N - 1 && s[i + 1] === ch;
      const cs = []; for (let j = i; j < 36 && s[j] === ch; j += h ? 1 : N) cs.push(j);
      const step = h ? 1 : N;
      for (const d of [-1, 1]) {
        for (let k = 1; ; k++) {
          const edge = d < 0 ? cs[0] - step * k : cs[cs.length - 1] + step * k;
          if (edge < 0 || edge >= 36) break;
          if (h && Math.floor(edge / N) !== Math.floor(cs[0] / N)) break;
          if (s[edge] !== '.') break;
          const a = s.split('');
          for (const c of cs) a[c] = '.';
          for (const c of cs) a[c + d * step * k] = ch;
          out.push([a.join(''), { id: ch, delta: d * k }]);
        }
      }
    }
    return out;
  }

  // ---------- view ----------
  const els = {};
  function build() {
    board.querySelectorAll('.car, .ghost').forEach(e => e.remove());
    for (const k of cars) {
      const el = document.createElement('div');
      el.className = `car ${k.h ? 'h' : 'v'} len${k.len}` + (k.id === 'A' ? ' target' : '');
      el.style.width = `${(k.h ? k.len : 1) * 100 / N}%`;
      el.style.height = `${(k.h ? 1 : k.len) * 100 / N}%`;
      if (k.col) el.style.setProperty('--c', k.col);
      el.innerHTML = '<div class="body"><div class="roof"></div></div>';
      bindDrag(el, k);
      board.appendChild(el); els[k.id] = el;
      position(k);
    }
  }
  function position(k, px = 0) {
    const el = els[k.id], cell = board.clientWidth / N;
    const x = k.c * cell + (k.h ? px : 0), y = k.r * cell + (k.h ? 0 : px);
    el.style.transform = `translate(${x}px, ${y}px)`;
  }
  function relayout() { if (cars) cars.forEach(k => position(k)); }
  window.addEventListener('resize', relayout);

  function ui() {
    $('lvl').textContent = `LEVEL ${idx + 1}`;
    $('moves').textContent = moves;
    $('best').textContent = LEVELS[idx][1];
    $('undo').disabled = !history.length || won;
  }

  function load(i) {
    idx = Math.max(0, Math.min(LEVELS.length - 1, i));
    store.set('pk.level', idx);
    cars = parse(LEVELS[idx][0]);
    moves = 0; history = []; won = false;
    $('note').textContent = idx === 0 ? '赤い車を右の出口まで出そう。車は向きに沿ってドラッグで動かせる。' : `最短 ${LEVELS[idx][1]} 手で解ける。`;
    build(); ui();
  }

  // ---------- drag ----------
  function bindDrag(el, k) {
    let start = null;
    el.addEventListener('pointerdown', e => {
      if (won) return;
      e.preventDefault(); clearHint();
      const [lo, hi] = range(k);
      start = { x: e.clientX, y: e.clientY, lo, hi, cell: board.clientWidth / N, off: 0 };
      el.classList.add('dragging');
      try { el.setPointerCapture(e.pointerId); } catch {}
    });
    el.addEventListener('pointermove', e => {
      if (!start) return;
      const d = k.h ? e.clientX - start.x : e.clientY - start.y;
      start.off = Math.max(start.lo * start.cell, Math.min(start.hi * start.cell, d));
      position(k, start.off);
    });
    const end = () => {
      if (!start) return;
      const steps = Math.round(start.off / start.cell);
      el.classList.remove('dragging');
      start = null;
      if (steps) {
        history.push({ id: k.id, r: k.r, c: k.c });
        if (k.h) k.c += steps; else k.r += steps;
        moves++; tick();
      }
      position(k); ui();
      if (k.id === 'A' && k.c + k.len === N) finish();
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  // ---------- audio ----------
  let ac = null;
  function tick() {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime, o = ac.createOscillator(), v = ac.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(300, t + 0.06);
      v.gain.setValueAtTime(0.08, t); v.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      o.connect(v).connect(ac.destination); o.start(t); o.stop(t + 0.1);
    } catch {}
  }
  function fanfare() {
    if (!ac) return;
    [523, 659, 784, 1047].forEach((f, i) => {
      const t = ac.currentTime + i * 0.09, o = ac.createOscillator(), v = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(0.12, t + 0.01); v.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.connect(v).connect(ac.destination); o.start(t); o.stop(t + 0.3);
    });
  }

  // ---------- win ----------
  const starsFor = (m, opt) => m <= opt ? 3 : m <= Math.ceil(opt * 1.5) ? 2 : 1;
  function finish() {
    won = true; ui();
    const el = els.A, cell = board.clientWidth / N;
    el.classList.add('leave');
    el.style.transform = `translate(${(N + 1.5) * cell}px, ${2 * cell}px)`;
    fanfare(); try { navigator.vibrate && navigator.vibrate([20, 40, 20]); } catch {}
    const opt = LEVELS[idx][1];
    const prevBest = progress[idx];
    if (!prevBest || moves < prevBest) { progress[idx] = moves; store.set('pk.progress', progress); }
    const s = starsFor(moves, opt);
    $('stars').innerHTML = '★'.repeat(s) + `<span class="off">${'★'.repeat(3 - s)}</span>`;
    $('winTitle').textContent = s === 3 ? '最短で脱出！' : '脱出成功！';
    $('winText').textContent = `${moves} 手（最短 ${opt} 手）` + (s < 3 ? '　★3 は最短手数で' : '');
    $('next').hidden = idx >= LEVELS.length - 1;
    setTimeout(() => { $('win').hidden = false; }, 650);
  }

  // ---------- hint ----------
  let hintTimer = 0;
  function clearHint() {
    clearTimeout(hintTimer);
    board.querySelectorAll('.ghost').forEach(e => e.remove());
    Object.values(els).forEach(e => e.classList.remove('hint'));
  }
  function hint() {
    if (won) return;
    clearHint();
    const mv = solveFrom(encode());
    if (!mv) return;
    const k = cars.find(c => c.id === mv.id), cell = board.clientWidth / N;
    els[k.id].classList.add('hint');
    const gh = document.createElement('div');
    gh.className = 'ghost';
    gh.style.width = `${(k.h ? k.len : 1) * 100 / N}%`;
    gh.style.height = `${(k.h ? 1 : k.len) * 100 / N}%`;
    const r = k.r + (k.h ? 0 : mv.delta), c = k.c + (k.h ? mv.delta : 0);
    gh.style.transform = `translate(${c * cell}px, ${r * cell}px)`;
    gh.innerHTML = '<div></div>';
    board.appendChild(gh);
    $('note').textContent = '光っている車を点線の位置へ。';
    hintTimer = setTimeout(clearHint, 2600);
  }

  // ---------- stage select ----------
  const TIERS = [[0, 10, '初級'], [10, 20, '中級'], [20, 30, '上級'], [30, 40, '達人']];
  function openSelect() {
    const g = $('grid'); g.innerHTML = '';
    const cleared = Object.keys(progress).map(Number);
    const unlocked = Math.max(4, ...cleared.map(i => i + 3));
    let total = 0;
    for (const [a, b, name] of TIERS) {
      const t = document.createElement('div'); t.className = 'tier'; t.textContent = `${name}　${LEVELS[a][1]}〜${LEVELS[b - 1][1]} 手`;
      g.appendChild(t);
      const box = document.createElement('div'); box.className = 'grid';
      for (let i = a; i < b; i++) {
        const btn = document.createElement('button'); btn.type = 'button';
        const s = progress[i] ? starsFor(progress[i], LEVELS[i][1]) : 0; total += s;
        btn.innerHTML = `${i + 1}<small>${s ? '★'.repeat(s) : i > unlocked ? '🔒' : ''}</small>`;
        if (i === idx) btn.classList.add('cur');
        btn.disabled = i > unlocked;
        btn.addEventListener('click', () => { $('select').hidden = true; load(i); });
        box.appendChild(btn);
      }
      g.appendChild(box);
    }
    $('selInfo').textContent = `★ ${total} / ${LEVELS.length * 3}　クリアすると先のステージが開く`;
    $('select').hidden = false;
  }

  // ---------- buttons ----------
  $('undo').addEventListener('click', () => {
    const h = history.pop(); if (!h || won) return;
    const k = cars.find(c => c.id === h.id); k.r = h.r; k.c = h.c; moves = Math.max(0, moves - 1); position(k); tick(); ui();
  });
  $('reset').addEventListener('click', () => { clearHint(); load(idx); });
  $('hint').addEventListener('click', hint);
  $('menu').addEventListener('click', openSelect);
  $('selClose').addEventListener('click', () => { $('select').hidden = true; });
  $('retry').addEventListener('click', () => { $('win').hidden = true; load(idx); });
  $('next').addEventListener('click', () => { $('win').hidden = true; load(idx + 1); });

  load(idx);
  requestAnimationFrame(relayout);
})();
</script>

</body>
</html>

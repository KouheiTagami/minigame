<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>オセロ盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Outfit:wght@500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0f2a22;
    --felt: #1f7a4d;
    --felt-dark: #186540;
    --frame: #0b1f19;
    --ink: #eef5ee;
    --dim: #9fbcae;
    --gold: #e8c46a;
    --black: #151515;
    --white: #f6f6f0;
    --num: "Outfit", "Helvetica Neue", Arial, sans-serif;
    --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  main { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 28px; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 0.06em; }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg { display: flex; background: var(--frame); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { font: 700 12px var(--body); color: var(--dim); background: transparent; border: none; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--felt); color: var(--ink); }

  .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
  .side { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 14px; background: var(--frame); border: 2px solid transparent; }
  .side.turn { border-color: var(--gold); }
  .side.r { flex-direction: row-reverse; text-align: right; }
  .disc-ic { width: 26px; height: 26px; border-radius: 50%; flex: none; }
  .disc-ic.b { background: radial-gradient(circle at 35% 30%, #4a4a4a, var(--black) 60%); }
  .disc-ic.w { background: radial-gradient(circle at 35% 30%, #ffffff, #d8d8cf 70%); }
  .side b { font: 700 28px var(--num); font-variant-numeric: tabular-nums; line-height: 1; }
  .side small { display: block; font-size: 11px; color: var(--dim); font-weight: 700; }
  .vs { color: var(--dim); font: 500 13px var(--num); }

  .frame { background: var(--frame); padding: 10px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
  .board { display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1; width: 100%; max-width: 100%; background: var(--felt-dark); gap: 1.5px; position: relative; }
  .sq { background: var(--felt); position: relative; display: grid; place-items: center; cursor: pointer; }
  .sq.last::after { content: ""; position: absolute; width: 16%; height: 16%; border-radius: 50%; background: #e0493c; z-index: 2; }
  .hint { width: 26%; height: 26%; border-radius: 50%; background: rgba(0,0,0,0.22); }
  .hint.show-w { background: rgba(255,255,255,0.28); }
  .disc { width: 84%; height: 84%; border-radius: 50%; position: relative; transform-style: preserve-3d; transition: transform 0.35s ease; }
  .disc .f, .disc .k { position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; box-shadow: 0 2px 3px rgba(0,0,0,0.35); }
  .disc .f { background: radial-gradient(circle at 35% 30%, #4a4a4a, var(--black) 60%); }
  .disc .k { background: radial-gradient(circle at 35% 30%, #ffffff, #d8d8cf 70%); transform: rotateY(180deg); }
  .disc.w { transform: rotateY(180deg); }
  .dot { position: absolute; width: 7px; height: 7px; background: var(--felt-dark); border-radius: 50%; z-index: 1; transform: translate(-50%, -50%); }

  .msg { min-height: 22px; text-align: center; font-size: 14px; color: var(--dim); font-weight: 700; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tools button { font: 700 14px var(--body); color: var(--ink); background: var(--frame); border: none; border-radius: 12px; padding: 12px 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button:disabled { opacity: 0.4; }

  .over { position: fixed; inset: 0; background: rgba(8, 20, 16, 0.8); display: grid; place-items: center; padding-inline: 16px; z-index: 10; }
  .card { background: var(--bg); border: 1px solid #2d5a48; border-radius: 20px; padding: 24px 20px; width: 100%; max-width: 320px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { margin: 0; font-size: 28px; font-weight: 900; }
  .card .big { font: 700 40px var(--num); }
  .card p { margin: 0; color: var(--dim); font-size: 13px; }
  .card button { font: 700 15px var(--body); border: none; border-radius: 12px; padding: 12px; background: var(--gold); color: #1b1b1b; cursor: pointer; margin-top: 6px; }
  @media (prefers-reduced-motion: reduce) { .disc { transition: none; } }
</style>
</head>
<body>
<main>
  <header><h1>オセロ盤</h1><span class="msg" id="rec" style="min-height:0;font-size:12px"></span></header>
  <div class="opts">
    <div class="seg" id="lvSeg" role="group" aria-label="CPUの強さ">
      <button type="button" data-v="1">よわい</button><button type="button" data-v="2">ふつう</button><button type="button" data-v="3">つよい</button>
    </div>
    <div class="seg" id="colSeg" role="group" aria-label="手番">
      <button type="button" data-v="1">先手 黒</button><button type="button" data-v="-1">後手 白</button>
    </div>
  </div>

  <div class="score">
    <div class="side" id="sB"><span class="disc-ic b"></span><div><small id="nB">あなた</small><b id="cB">2</b></div></div>
    <span class="vs">vs</span>
    <div class="side r" id="sW"><span class="disc-ic w"></span><div><small id="nW">CPU</small><b id="cW">2</b></div></div>
  </div>

  <div class="frame"><div class="board" id="board"></div></div>
  <div class="msg" id="msg">あなたの番です</div>

  <div class="tools">
    <button type="button" id="undo">待った</button>
    <button type="button" id="newg">新しい対局</button>
  </div>
</main>

<div class="over" id="over" hidden>
  <div class="card">
    <h2 id="oTitle">勝ち！</h2>
    <div class="big" id="oScore">40 - 24</div>
    <p id="oSub">ふつう の CPU に勝利</p>
    <button type="button" id="oBtn">もう一局</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const DIRS = [-9, -8, -7, -1, 1, 7, 8, 9];
  const W = [
    100, -20, 10, 5, 5, 10, -20, 100,
    -20, -40, -2, -2, -2, -2, -40, -20,
    10, -2, 1, 1, 1, 1, -2, 10,
    5, -2, 1, 0, 0, 1, -2, 5,
    5, -2, 1, 0, 0, 1, -2, 5,
    10, -2, 1, 1, 1, 1, -2, 10,
    -20, -40, -2, -2, -2, -2, -40, -20,
    100, -20, 10, 5, 5, 10, -20, 100
  ];
  const LVNAME = { 1: 'よわい', 2: 'ふつう', 3: 'つよい' };

  let level = store.get('ot.level', 2), me = store.get('ot.color', 1);
  let b, turn, hist, last, busy = false, over = false;
  const rec = store.get('ot.rec', {});

  function flips(bd, i, p) {
    if (bd[i]) return [];
    const out = [], r = i >> 3, c = i & 7;
    for (const d of DIRS) {
      const dc = d === -9 || d === -1 || d === 7 ? -1 : d === -7 || d === 1 || d === 9 ? 1 : 0;
      const line = [];
      let rr = r, cc = c, j = i;
      while (true) {
        rr += d > 1 || d < -1 ? Math.sign(d) : 0; cc += dc; j += d;
        if (rr < 0 || rr > 7 || cc < 0 || cc > 7) { line.length = 0; break; }
        if (bd[j] === -p) line.push(j);
        else { if (bd[j] !== p) line.length = 0; break; }
      }
      out.push(...line);
    }
    return out;
  }
  const moves = (bd, p) => { const m = []; for (let i = 0; i < 64; i++) if (!bd[i] && flips(bd, i, p).length) m.push(i); return m; };
  function play(bd, i, p) { const f = flips(bd, i, p); const n = bd.slice(); n[i] = p; f.forEach(j => n[j] = p); return n; }

  // ---------- AI ----------
  function evaluate(bd, p) {
    let e = 0, empty = 0;
    for (let i = 0; i < 64; i++) { e += W[i] * bd[i]; if (!bd[i]) empty++; }
    if (empty < 12) { let d = 0; for (const v of bd) d += v; e = e * 0.3 + d * 10; }
    const mob = moves(bd, 1).length - moves(bd, -1).length;
    return (e + mob * 6) * p;
  }
  function negamax(bd, p, depth, a, beta, passed) {
    if (depth === 0) return evaluate(bd, p);
    const ms = moves(bd, p);
    if (!ms.length) {
      if (passed) { let d = 0; for (const v of bd) d += v; return d * p * 1000; }
      return -negamax(bd, -p, depth, -beta, -a, true);
    }
    ms.sort((x, y) => W[y] - W[x]);
    let best = -Infinity;
    for (const m of ms) {
      const v = -negamax(play(bd, m, p), -p, depth - 1, -beta, -a, false);
      if (v > best) best = v;
      if (v > a) a = v;
      if (a >= beta) break;
    }
    return best;
  }
  function cpuMove(bd, p) {
    const ms = moves(bd, p);
    if (!ms.length) return -1;
    if (level === 1) {
      // mostly greedy on flips, with some randomness
      if (Math.random() < 0.35) return ms[Math.floor(Math.random() * ms.length)];
      return ms.reduce((a, m) => flips(bd, m, p).length > flips(bd, a, p).length ? m : a, ms[0]);
    }
    const empty = bd.filter(v => !v).length;
    const depth = level === 2 ? 3 : empty <= 10 ? 10 : 5;
    let best = ms[0], bv = -Infinity;
    for (const m of ms.sort((x, y) => W[y] - W[x])) {
      const v = -negamax(play(bd, m, p), -p, depth - 1, -Infinity, -bv, false);
      if (v > bv) { bv = v; best = m; }
    }
    return best;
  }

  // ---------- view ----------
  const boardEl = $('board'), sqs = [];
  for (let i = 0; i < 64; i++) {
    const s = document.createElement('div'); s.className = 'sq';
    s.addEventListener('click', () => humanMove(i));
    boardEl.appendChild(s); sqs.push(s);
  }
  for (const [x, y] of [[25, 25], [75, 25], [25, 75], [75, 75]]) {
    const d = document.createElement('div'); d.className = 'dot'; d.style.left = x + '%'; d.style.top = y + '%'; boardEl.appendChild(d);
  }

  function render(flipped = []) {
    const legal = turn === me && !over ? moves(b, me) : [];
    for (let i = 0; i < 64; i++) {
      const s = sqs[i];
      s.classList.toggle('last', i === last);
      if (b[i]) {
        let disc = s.querySelector('.disc');
        if (!disc) { s.innerHTML = '<div class="disc"><div class="f"></div><div class="k"></div></div>'; disc = s.firstChild; if (b[i] === -1) disc.classList.add('w'); }
        else disc.classList.toggle('w', b[i] === -1);
      } else s.innerHTML = legal.includes(i) ? `<div class="hint ${me === -1 ? 'show-w' : ''}"></div>` : '';
    }
    let nb = 0, nw = 0; b.forEach(v => { if (v === 1) nb++; else if (v === -1) nw++; });
    $('cB').textContent = nb; $('cW').textContent = nw;
    $('nB').textContent = me === 1 ? 'あなた' : 'CPU';
    $('nW').textContent = me === -1 ? 'あなた' : 'CPU';
    $('sB').classList.toggle('turn', turn === 1 && !over);
    $('sW').classList.toggle('turn', turn === -1 && !over);
    $('undo').disabled = busy || !hist.length;
    document.querySelectorAll('#lvSeg button').forEach(x => x.setAttribute('aria-pressed', +x.dataset.v === level));
    document.querySelectorAll('#colSeg button').forEach(x => x.setAttribute('aria-pressed', +x.dataset.v === me));
    const r = rec[level] || { w: 0, l: 0, d: 0 };
    $('rec').textContent = `vs ${LVNAME[level]}　${r.w}勝 ${r.l}敗${r.d ? ` ${r.d}分` : ''}`;
  }

  function newGame() {
    b = Array(64).fill(0); b[27] = b[36] = -1; b[28] = b[35] = 1;
    turn = 1; hist = []; last = -1; over = false; busy = false;
    $('over').hidden = true;
    render(); next();
  }

  function sfx() {
    try {
      const ac = sfx.ac || (sfx.ac = new (window.AudioContext || window.webkitAudioContext)());
      const t = ac.currentTime, o = ac.createOscillator(), v = ac.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(300, t + 0.05);
      v.gain.setValueAtTime(0.15, t); v.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      o.connect(v).connect(ac.destination); o.start(t); o.stop(t + 0.1);
    } catch {}
  }

  function doMove(i, p) { b = play(b, i, p); last = i; turn = -p; sfx(); render(); }

  function humanMove(i) {
    if (over || busy || turn !== me || !flips(b, i, me).length) return;
    hist.push({ b: b.slice(), last });
    doMove(i, me); next();
  }

  function next() {
    const ms = moves(b, turn);
    if (!ms.length) {
      if (!moves(b, -turn).length) return finish();
      $('msg').textContent = turn === me ? 'あなたは置ける場所がないのでパス' : 'CPUはパス';
      turn = -turn; render();
      return setTimeout(next, 900);
    }
    if (turn === me) { $('msg').textContent = 'あなたの番です'; render(); return; }
    $('msg').textContent = 'CPU 考え中…'; busy = true; render();
    setTimeout(() => {
      const m = cpuMove(b, turn);
      busy = false;
      if (m >= 0) doMove(m, turn);
      next();
    }, 450);
  }

  function finish() {
    over = true; render();
    let nb = 0, nw = 0; b.forEach(v => { if (v === 1) nb++; else if (v === -1) nw++; });
    const mine = me === 1 ? nb : nw, cpu = me === 1 ? nw : nb;
    const r = rec[level] || { w: 0, l: 0, d: 0 };
    let title;
    if (mine > cpu) { r.w++; title = '勝ち！'; } else if (mine < cpu) { r.l++; title = '負け…'; } else { r.d++; title = '引き分け'; }
    rec[level] = r; store.set('ot.rec', rec);
    $('msg').textContent = '対局終了';
    $('oTitle').textContent = title;
    $('oScore').textContent = `${mine} - ${cpu}`;
    $('oSub').textContent = `${LVNAME[level]} の CPU と対局　通算 ${r.w}勝 ${r.l}敗`;
    render();
    setTimeout(() => { $('over').hidden = false; }, 700);
  }

  $('undo').addEventListener('click', () => {
    if (busy || !hist.length) return;
    const h = hist.pop(); b = h.b; last = h.last; turn = me; over = false; $('over').hidden = true;
    render(); next();
  });
  $('newg').addEventListener('click', newGame);
  $('oBtn').addEventListener('click', newGame);
  $('lvSeg').addEventListener('click', e => { const v = e.target.dataset?.v; if (!v) return; level = +v; store.set('ot.level', level); render(); });
  $('colSeg').addEventListener('click', e => { const v = e.target.dataset?.v; if (!v || busy) return; me = +v; store.set('ot.color', me); newGame(); });

  newGame();
})();
</script>

</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>デッドアワー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0d0b; --panel: #151a17; --panel-hi: #1e2521; --line: #2c3530;
    --ink: #eef2ea; --dim: #9aa59a; --red: #e5484d; --acid: #9be15d; --amber: #ffc94d;
    --display: "Sora", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #pause { position: absolute; top: 14px; right: 10px; width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: rgba(21, 26, 23, 0.8); font-family: var(--display); font-weight: 800; }
  .panel { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(5, 8, 6, 0.8); backdrop-filter: blur(3px); overflow-y: auto; }
  .box { width: min(100%, 420px); display: flex; flex-direction: column; gap: 14px; }
  .eyebrow { font-family: var(--display); font-size: 11px; font-weight: 800; letter-spacing: 0.22em; color: var(--red); }
  h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(36px, 11vw, 52px); line-height: 1.05; letter-spacing: 0.02em; }
  h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: 0.06em; text-align: center; }
  .lead { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.75; }
  .dim { margin: 0; color: var(--dim); font-size: 12.5px; line-height: 1.6; text-align: center; }
  .bank { font-family: var(--display); font-weight: 800; color: var(--amber); font-size: 15px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .btn { padding: 13px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; font-size: 15px; }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; font-family: var(--display); font-weight: 800; letter-spacing: 0.08em; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .chars { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .char { text-align: left; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 3px; }
  .char.sel { border-color: var(--amber); background: var(--panel-hi); }
  .char b { font-size: 14.5px; }
  .char span { font-size: 11.5px; color: var(--dim); line-height: 1.45; }
  .char .cost { color: var(--amber); font-weight: 700; }
  .cards { display: flex; flex-direction: column; gap: 9px; }
  .card { display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: center; text-align: left; padding: 11px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); }
  button.card:active { transform: scale(0.98); }
  .card.evo { border-color: var(--amber); background: #2a2413; }
  .ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; color: #10140f; font-weight: 700; font-size: 22px; }
  .card .t { font-weight: 700; font-size: 15px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
  .card .tag { font-family: var(--display); font-size: 10.5px; font-weight: 800; letter-spacing: 0.05em; color: var(--amber); }
  .card .d { color: var(--dim); font-size: 12.5px; line-height: 1.5; margin-top: 2px; }
  .shop { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .shop button { text-align: left; padding: 9px 11px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 2px; }
  .shop button:disabled { opacity: 0.5; }
  .shop b { font-size: 13.5px; }
  .shop span { font-size: 11.5px; color: var(--dim); }
  .shop .cost { color: var(--amber); font-weight: 700; }
  .build { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .chip { font-size: 12px; padding: 4px 9px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); }
  .chip.evo { border-color: var(--amber); color: var(--amber); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stats div { padding: 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); text-align: center; font-size: 11.5px; color: var(--dim); }
  .stats b { display: block; font-family: var(--display); font-size: 20px; color: var(--ink); }
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <button type="button" id="pause" aria-label="一時停止" hidden>Ⅱ</button>

  <section class="panel" id="pTitle">
    <div class="box">
      <div class="eyebrow">ZOMBIE SURVIVAL · 10 MIN</div>
      <h1>デッドアワー</h1>
      <p class="lead">感染都市で10分間、救出ヘリを待て。攻撃はすべて自動。指をスライドして逃げ回り、レベルアップで武器と装備を揃えて生き延びろ。</p>
      <div class="bank" id="bank"></div>
      <div class="chars" id="chars"></div>
      <div class="row">
        <button type="button" class="btn primary" id="startBtn">出撃</button>
        <button type="button" class="btn" id="shopBtn">恒久強化</button>
      </div>
      <p class="dim" id="bestLine"></p>
    </div>
  </section>

  <section class="panel" id="pShop" hidden>
    <div class="box">
      <h2>恒久強化</h2>
      <div class="bank" id="bank2" style="text-align:center"></div>
      <div class="shop" id="shopList"></div>
      <button type="button" class="btn" id="shopBack">戻る</button>
    </div>
  </section>

  <section class="panel" id="pLv" hidden>
    <div class="box">
      <h2 id="lvTitle">LEVEL UP</h2>
      <div class="cards" id="cards"></div>
      <button type="button" class="btn" id="rerollBtn">引き直し</button>
    </div>
  </section>

  <section class="panel" id="pChest" hidden>
    <div class="box">
      <h2>補給物資</h2>
      <div class="cards" id="chestList"></div>
      <button type="button" class="btn primary" id="chestOk">受け取る</button>
    </div>
  </section>

  <section class="panel" id="pPause" hidden>
    <div class="box">
      <h2>PAUSE</h2>
      <div class="build" id="build"></div>
      <button type="button" class="btn primary" id="resumeBtn">再開</button>
      <button type="button" class="btn" id="quitBtn">撤退する</button>
    </div>
  </section>

  <section class="panel" id="pOver" hidden>
    <div class="box">
      <div class="eyebrow" id="overEyebrow" style="text-align:center"></div>
      <h2 id="overTitle"></h2>
      <div class="stats" id="overStats"></div>
      <div class="build" id="overBuild"></div>
      <div class="row">
        <button type="button" class="btn primary" id="retryBtn">もう一度</button>
        <button type="button" class="btn" id="homeBtn">タイトルへ</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cvs = $('c'), g = cvs.getContext('2d');
  const LS = 'dh.save';
  function load() { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } }
  const save = Object.assign({ coins: 0, shop: {}, chars: { kai: 1, mina: 1 }, bestT: 0, bestK: 0, clears: 0, ch: 'kai' }, load());
  function persist() { try { localStorage.setItem(LS, JSON.stringify(save)); } catch {} }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---------- view ----------
  let W = 400, H = 700, S = 1, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    S = Math.max(0.8, Math.min(w, h) / 390);
    W = w / S; H = h / S;
    cvs.width = w * dpr; cvs.height = h * dpr;
  }
  window.addEventListener('resize', resize);

  // ---------- data ----------
  const T_END = 600;
  const UPTXT = { n: '発射数 +1', d: 'ダメージ +25%', a: '範囲 +15%', c: 'クールダウン −12%', p: '貫通 +1', t: '持続 +20%' };
  const WEP = {
    pistol: { name: 'ハンドガン', ic: '銃', col: '#9fc0ff', desc: '一番近い敵を撃つ', dmg: 10, cd: 1.05, n: 1, pierce: 0, up: ['n', 'c', 'd', 'p', 'n', 'd', 'c'], need: 'cd', evo: 'マグナム', evoDesc: '全てを貫通する大口径弾' },
    knife: { name: 'コンバットナイフ', ic: '刃', col: '#d9e2ec', desc: '向いている方向へ投げる', dmg: 7, cd: 0.95, n: 1, pierce: 0, up: ['n', 'd', 'n', 'p', 'n', 'd', 'n'], need: 'pspd', evo: 'サウザンドエッジ', evoDesc: '途切れなく投げ続ける' },
    shotgun: { name: 'ショットガン', ic: '散', col: '#ffb36b', desc: '近い敵へ散弾。強く押し返す', dmg: 8, cd: 1.9, n: 3, pierce: 1, up: ['d', 'n', 'c', 'd', 'n', 'p', 'd'], need: 'amount', evo: 'フルオート', evoDesc: '散弾 +4、連射' },
    pipe: { name: '鉄パイプ', ic: '管', col: '#c9b6ff', desc: '左右をなぎ払う', dmg: 12, cd: 1.3, n: 1, pierce: 0, up: ['d', 'a', 'n', 'd', 'a', 'd', 'c'], need: 'maxhp', evo: 'チェーンソー', evoDesc: '当てるたびに体力を吸う' },
    grenade: { name: '手榴弾', ic: '榴', col: '#9be15d', desc: '敵の群れに投げ込んで爆発', dmg: 22, cd: 3.2, n: 1, pierce: 0, up: ['a', 'd', 'n', 'd', 'a', 'c', 'n'], need: 'area', evo: 'ロケットランチャー', evoDesc: '直進して大爆発' },
    molotov: { name: '火炎瓶', ic: '炎', col: '#ff8a3d', desc: '地面を燃やし続ける', dmg: 6, cd: 4.4, n: 1, pierce: 0, dur: 3, up: ['a', 't', 'n', 'd', 'a', 'd', 'n'], need: 'magnet', evo: 'ナパーム', evoDesc: '広く、長く燃える' },
    field: { name: 'スタンフィールド', ic: '電', col: '#7fe8ff', desc: '周囲の敵に電撃', dmg: 4, cd: 0.8, n: 0, pierce: 0, up: ['a', 'd', 'a', 'd', 'c', 'a', 'd'], need: 'regen', evo: 'ライフドレイン', evoDesc: '範囲内で倒すと回復' },
    drone: { name: '護衛ドローン', ic: '機', col: '#ffd36e', desc: '周囲を回って切り刻む', dmg: 9, cd: 3, n: 2, pierce: 0, dur: 3, up: ['n', 'a', 't', 'd', 'n', 't', 'd'], need: 'dur', evo: 'ガーディアン', evoDesc: '常時展開' },
    strike: { name: '空爆要請', ic: '爆', col: '#ff6b6b', desc: 'ランダムな敵に着弾', dmg: 18, cd: 3.6, n: 2, pierce: 0, up: ['n', 'a', 'd', 'n', 'c', 'd', 'n'], need: 'luck', evo: '絨毯爆撃', evoDesc: '2連続で着弾' },
    bow: { name: 'ボウガン', ic: '弩', col: '#8fd3a8', desc: '画面端で跳ね返る貫通矢', dmg: 9, cd: 2.8, n: 1, pierce: 999, dur: 2.2, up: ['d', 'n', 't', 'd', 'n', 't', 'd'], need: 'armor', evo: 'ライオットボルト', evoDesc: '倍の時間跳ね回る' },
    flame: { name: '火炎放射器', ic: '焔', col: '#ffa24d', desc: '近距離を焼き払う', dmg: 3, cd: 2.6, n: 1, pierce: 999, dur: 1, up: ['d', 't', 'a', 'd', 'n', 'c', 'd'], need: 'might', evo: 'ブルーフレイム', evoDesc: '射程と火力が跳ね上がる' },
    mine: { name: '感知地雷', ic: '雷', col: '#e6e06a', desc: '足元に設置、近づくと爆発', dmg: 30, cd: 3.4, n: 1, pierce: 0, up: ['d', 'n', 'a', 'd', 'n', 'c', 'd'], need: 'speed', evo: 'クラスター地雷', evoDesc: '設置数 +2' }
  };
  const PAS = {
    might: { name: '筋力増強剤', ic: '力', col: '#ff8fb1', desc: 'ダメージ +10%', max: 5 },
    armor: { name: '防弾ベスト', ic: '防', col: '#8fa4c9', desc: '被ダメージ −1', max: 5 },
    maxhp: { name: '救急キット', ic: '命', col: '#ff6b6b', desc: '最大体力 +20%', max: 5 },
    regen: { name: 'グリーンハーブ', ic: '草', col: '#9be15d', desc: '毎秒 0.3 回復', max: 5 },
    cd: { name: '弾薬ポーチ', ic: '弾', col: '#9fc0ff', desc: 'クールダウン −8%', max: 5 },
    area: { name: '火薬', ic: '薬', col: '#ffb36b', desc: '攻撃範囲 +10%', max: 5 },
    pspd: { name: '強化グリップ', ic: '握', col: '#d9e2ec', desc: '弾速 +10%', max: 5 },
    dur: { name: 'バッテリー', ic: '池', col: '#ffd36e', desc: '効果時間 +10%', max: 5 },
    amount: { name: '拡張マガジン', ic: '倉', col: '#c9b6ff', desc: '全武器の発射数 +1', max: 2 },
    speed: { name: 'ランニングシューズ', ic: '靴', col: '#7fe8ff', desc: '移動速度 +10%', max: 5 },
    magnet: { name: '電磁石', ic: '磁', col: '#8fd3a8', desc: '回収範囲 +25%', max: 5 },
    luck: { name: 'お守り', ic: '運', col: '#e6e06a', desc: '運 +10%（ドロップ・4択目）', max: 5 }
  };
  const CHARS = {
    kai: { name: 'カイ', job: '元警官', wep: 'pistol', col: '#5b8bd9', note: 'クールダウン −10%', cd: 0.9 },
    mina: { name: 'ミナ', job: '救急隊員', wep: 'pipe', col: '#e0707a', note: '体力 +30・毎秒0.3回復', hp: 30, regen: 0.3 },
    rou: { name: 'ロウ', job: '傭兵', wep: 'shotgun', col: '#8a9a5b', note: 'ダメージ +15%・足が遅い', might: 1.15, speed: 0.94, cost: 200 },
    yuki: { name: 'ユキ', job: '研究員', wep: 'molotov', col: '#b08fe0', note: '範囲 +15%・経験値 +10%', area: 1.15, growth: 1.1, cost: 200 }
  };
  const SHOP = [
    { k: 'might', name: '攻撃力', d: '+5%', max: 5, cost: 40 }, { k: 'maxhp', name: '体力', d: '+10%', max: 3, cost: 40 },
    { k: 'armor', name: '防御', d: '被ダメ −1', max: 3, cost: 80 }, { k: 'regen', name: '自然回復', d: '+0.1/秒', max: 5, cost: 40 },
    { k: 'cd', name: '連射', d: 'CD −2.5%', max: 2, cost: 120 }, { k: 'area', name: '範囲', d: '+5%', max: 2, cost: 60 },
    { k: 'speed', name: '移動速度', d: '+5%', max: 2, cost: 60 }, { k: 'magnet', name: '回収範囲', d: '+25%', max: 2, cost: 40 },
    { k: 'luck', name: '運', d: '+10%', max: 3, cost: 80 }, { k: 'growth', name: '成長', d: '経験値 +3%', max: 5, cost: 80 },
    { k: 'greed', name: '強欲', d: 'コイン +10%', max: 5, cost: 40 }, { k: 'reroll', name: '引き直し', d: '+1回', max: 3, cost: 60 },
    { k: 'revive', name: '復活', d: '1回だけ蘇る', max: 1, cost: 300 }, { k: 'amount', name: '発射数', d: '全武器 +1', max: 1, cost: 600 }
  ];
  const EN = {
    walker: { hp: 10, spd: 26, r: 9, dmg: 8, xp: 1, col: '#6f8f6a' },
    crawler: { hp: 5, spd: 40, r: 7, dmg: 5, xp: 1, col: '#8a7f62' },
    runner: { hp: 13, spd: 58, r: 8, dmg: 8, xp: 2, col: '#a5694f' },
    dog: { hp: 8, spd: 88, r: 7, dmg: 6, xp: 2, col: '#5b4a44' },
    bloater: { hp: 55, spd: 20, r: 15, dmg: 14, xp: 5, col: '#9aa84a', kres: 0.6 },
    riot: { hp: 90, spd: 24, r: 11, dmg: 12, xp: 6, col: '#4f5f78', kres: 0.7 },
    crow: { hp: 5, spd: 130, r: 6, dmg: 5, xp: 1, col: '#22252b' },
    elite: { hp: 320, spd: 34, r: 19, dmg: 16, xp: 25, col: '#b04a6a', kres: 0.85, chest: 1 },
    boss1: { name: '処刑人', hp: 2600, spd: 36, r: 26, dmg: 18, xp: 80, col: '#7a2f2f', kres: 0.95, chest: 3, boss: 1 },
    boss2: { name: '暴君', hp: 14000, spd: 44, r: 30, dmg: 24, xp: 150, col: '#3d3f52', kres: 1, chest: 5, boss: 1 },
    crate: { hp: 1, spd: 0, r: 10, dmg: 0, xp: 0, col: '#8a6a3a' }
  };
  const WAVES = [
    [0.6, 45, { walker: 2, crawler: 1 }],
    [0.5, 70, { walker: 3, crawler: 2 }],
    [0.45, 90, { walker: 3, crawler: 2, runner: 1 }],
    [0.45, 105, { walker: 2, runner: 2, dog: 1, bloater: 0.4 }],
    [0.4, 130, { runner: 3, dog: 2, bloater: 0.6 }],
    [0.34, 160, { walker: 4, riot: 1, crawler: 3 }],
    [0.28, 190, { runner: 3, riot: 1, bloater: 1, dog: 2 }],
    [0.24, 220, { walker: 4, riot: 2, bloater: 1, crawler: 3 }],
    [0.2, 250, { runner: 4, riot: 3, dog: 3 }],
    [0.15, 300, { walker: 3, runner: 4, riot: 4, dog: 3, bloater: 2 }]
  ];
  const needFor = l => l < 30 ? Math.round(4 + 2.4 * (l - 1)) : 74 + 4 * (l - 30);

  // ---------- state ----------
  let state = 'title', time = 0, tt = 0, hpMul = 1, spT = 0, lastSec = -1, boss = null, shake = 0, flash = 0, banner = null, pend = 0, pickAt = 0, gems = 0;
  let P = null, enemies = [], projs = [], lobs = [], zones = [], mines = [], hazards = [], pickups = [], floats = [], parts = [], decals = [], grid = new Map();
  const joy = { on: false, ox: 0, oy: 0, dx: 0, dy: 0, id: null };

  function recalc() {
    const s = save.shop, p = P.pas, c = CHARS[P.ch], gk = k => s[k] || 0, q = k => p[k] || 0;
    P.might = (1 + 0.05 * gk('might') + 0.1 * q('might')) * (c.might || 1);
    P.armor = gk('armor') + q('armor');
    const mh = Math.round((100 + (c.hp || 0)) * (1 + 0.1 * gk('maxhp') + 0.2 * q('maxhp')));
    if (P.maxhp && mh > P.maxhp) P.hp += mh - P.maxhp;
    P.maxhp = mh;
    P.regen = 0.1 * gk('regen') + 0.3 * q('regen') + (c.regen || 0);
    P.cd = (1 - 0.025 * gk('cd') - 0.08 * q('cd')) * (c.cd || 1);
    P.area = (1 + 0.05 * gk('area') + 0.1 * q('area')) * (c.area || 1);
    P.pspd = 1 + 0.1 * q('pspd');
    P.dur = 1 + 0.1 * q('dur');
    P.amount = gk('amount') + q('amount');
    P.speed = 78 * (1 + 0.05 * gk('speed') + 0.1 * q('speed')) * (c.speed || 1);
    P.magnet = 38 * (1 + 0.25 * gk('magnet') + 0.25 * q('magnet'));
    P.luck = 1 + 0.1 * gk('luck') + 0.1 * q('luck');
    P.growth = (1 + 0.03 * gk('growth')) * (c.growth || 1);
    P.greed = 1 + 0.1 * gk('greed');
  }
  const newWep = id => ({ id, lv: 1, m: { n: 0, d: 0, a: 0, c: 0, p: 0, t: 0 }, t: 0.3, q: 0, qt: 0, qi: 0.1, ang: 0, evo: false, on: false });

    // pickups
    for (const p of pickups) {
      const x = p.x - cx, y = p.y - cy;
      if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;
      if (p.kind === 'xp') { g.fillStyle = p.v >= 10 ? '#ff6b8b' : p.v >= 3 ? '#6fb4ff' : '#7ee07a'; g.beginPath(); g.moveTo(x, y - 4); g.lineTo(x + 3, y); g.lineTo(x, y + 4); g.lineTo(x - 3, y); g.fill(); }
      else if (p.kind === 'coin') { g.fillStyle = '#ffc94d'; circ(x, y, p.v > 1 ? 5 : 3.5); g.fillStyle = '#a87a12'; circ(x, y, p.v > 1 ? 2.5 : 1.5); }
      else if (p.kind === 'herb') { g.fillStyle = '#3f8f3a'; circ(x - 3, y, 4); circ(x + 3, y, 4); circ(x, y - 4, 4); g.fillStyle = '#c0452f'; g.fillRect(x - 3, y + 3, 6, 5); }
      else if (p.kind === 'magnet') { g.strokeStyle = '#e5484d'; g.lineWidth = 3.5; g.beginPath(); g.arc(x, y, 5, 3.14, 6.283); g.stroke(); g.fillStyle = '#ddd'; g.fillRect(x - 7, y, 3.5, 4); g.fillRect(x + 3.5, y, 3.5, 4); }
      else if (p.kind === 'bomb') { g.fillStyle = '#16181c'; circ(x, y, 6); g.fillStyle = '#ff8a3d'; circ(x + 4, y - 6, 2 + Math.sin(time * 14)); }
      else { g.fillStyle = '#ffc94d'; g.fillRect(x - 10, y - 7, 20, 14); g.fillStyle = '#7a4a12'; g.fillRect(x - 10, y - 1, 20, 2); g.fillRect(x - 2, y - 3, 4, 6); g.strokeStyle = `rgba(255,220,120,${0.5 + 0.4 * Math.sin(time * 6)})`; g.lineWidth = 2; g.strokeRect(x - 12, y - 9, 24, 18); }
    }
    for (const e of enemies) drawEnemy(e, cx, cy);
    // player
    {
      const x = W / 2, y = H / 2, a = Math.atan2(P.fy, P.fx), c = CHARS[P.ch], blink = P.inv > 0 && Math.sin(time * 50) > 0;
      g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(x, y + 3, 10, 7, 0, 0, 6.283); g.fill();
      g.strokeStyle = '#1b1f1d'; g.lineWidth = 3.5; g.beginPath(); g.moveTo(x + Math.cos(a) * 5, y + Math.sin(a) * 5); g.lineTo(x + Math.cos(a) * 15, y + Math.sin(a) * 15); g.stroke();
      g.fillStyle = blink ? '#fff' : c.col; circ(x, y, 8.5);
      g.fillStyle = blink ? '#fff' : '#e8cdb0'; circ(x + Math.cos(a) * 2, y + Math.sin(a) * 2, 4.6);
      g.fillStyle = '#300'; g.fillRect(x - 15, y + 15, 30, 4); g.fillStyle = P.hp / P.maxhp > 0.35 ? '#7ee07a' : '#e5484d'; g.fillRect(x - 15, y + 15, 30 * Math.max(0, P.hp / P.maxhp), 4);
    }
    for (const w of P.weapons) if (w.id === 'drone' && w.on && w.s) {
      const R = 56 * w.s.area;
      for (let k = 0; k < w.s.n; k++) { const a = w.ang + k / w.s.n * 6.283, x = W / 2 + Math.cos(a) * R, y = H / 2 + Math.sin(a) * R; g.fillStyle = w.evo ? '#ffc94d' : '#ffd36e'; circ(x, y, 5); g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 1.5; g.beginPath(); g.arc(x, y, 8, time * 30, time * 30 + 2); g.stroke(); }
    }
    for (const p of projs) {
      const x = p.x - cx, y = p.y - cy;
      if (p.shape === 'flame') { g.globalAlpha = Math.min(1, p.life * 3.5) * 0.7; g.fillStyle = p.col; circ(x, y, p.r * (1.3 - p.life)); g.globalAlpha = 1; continue; }
      g.fillStyle = p.col;
      if (p.shape === 'b') { circ(x, y, p.r); continue; }
      const l = p.shape === 'rocket' ? 9 : p.shape === 'bolt' ? 10 : 8, wd = p.shape === 'rocket' ? 3.5 : 2;
      const ca = Math.cos(p.a), sa = Math.sin(p.a);
      g.beginPath(); g.moveTo(x + ca * l, y + sa * l); g.lineTo(x - ca * l * 0.6 - sa * wd, y - sa * l * 0.6 + ca * wd); g.lineTo(x - ca * l * 0.6 + sa * wd, y - sa * l * 0.6 - ca * wd); g.fill();
    }
    for (const l of lobs) {
      const k = l.t / l.T, x = l.x0 + (l.tx - l.x0) * k - cx, y = l.y0 + (l.ty - l.y0) * k - cy - Math.sin(k * 3.14) * 34;
      g.fillStyle = l.kind === 'gren' ? '#4f6a3a' : '#ff8a3d'; circ(x, y, 4);
    }
    for (const z of zones) {
      const k = z.life / z.max, x = z.x - cx, y = z.y - cy;
      if (z.kind === 'boom') { g.fillStyle = z.col; g.globalAlpha = k * 0.55; circ(x, y, z.r * (1.05 - k * 0.4)); g.globalAlpha = k; g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, z.r * (1.05 - k * 0.3), 0, 6.283); g.stroke(); g.globalAlpha = 1; }
      else if (z.kind === 'strike') { g.globalAlpha = k; g.fillStyle = z.col; g.fillRect(x - 2.5, y - H, 5, H); g.globalAlpha = 1; }
      else if (z.kind === 'slash') { g.globalAlpha = k * 0.8; g.fillStyle = z.col; g.beginPath(); g.ellipse(x + z.dir * z.r / 2, y, z.r / 2, z.w * (0.5 + 0.5 * k), 0, 0, 6.283); g.fill(); g.globalAlpha = 1; }
    }
    for (const p of parts) { g.globalAlpha = Math.min(1, p.life * 3); g.fillStyle = p.col; g.fillRect(p.x - cx - p.s / 2, p.y - cy - p.s / 2, p.s, p.s); }
    g.globalAlpha = 1;
    // darkness
    const lg = g.createRadialGradient(W / 2, H / 2, 70, W / 2, H / 2, Math.max(W, H) * 0.62);
    lg.addColorStop(0, 'rgba(0,0,0,0)'); lg.addColorStop(1, 'rgba(0,4,2,0.62)');
    g.fillStyle = lg; g.fillRect(0, 0, W, H);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const f of floats) { g.globalAlpha = Math.min(1, 1.5 - f.t * 1.5); g.fillStyle = f.col; g.font = `800 ${f.size}px Sora, sans-serif`; g.fillText(f.text, f.x - cx, f.y - cy - f.t * 18); }
    g.globalAlpha = 1;
    if (flash > 0) { g.fillStyle = `rgba(255,60,60,${Math.min(0.5, flash * 1.6)})`; g.fillRect(0, 0, W, H); }
    if (P.hp / P.maxhp < 0.3) { const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.6); vg.addColorStop(0, 'rgba(160,0,0,0)'); vg.addColorStop(1, `rgba(160,0,0,${0.3 + 0.12 * Math.sin(time * 6)})`); g.fillStyle = vg; g.fillRect(0, 0, W, H); }

    // HUD
    g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, 0, W, 8);
    g.fillStyle = '#6fb4ff'; g.fillRect(0, 0, W * Math.min(1, P.xp / P.need), 8);
    g.fillStyle = '#eef2ea'; g.font = '800 22px Sora, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'top';
    g.fillText(mmss(Math.max(0, T_END - time)), W / 2, 16);
    g.font = '800 11px Sora, sans-serif'; g.textAlign = 'left';
    g.fillText(`LV ${P.lvl}`, 10, 14);
    g.fillStyle = '#c9d2c5'; g.fillText(`☠ ${P.kills}`, 10, 29);
    g.fillStyle = '#ffc94d'; g.fillText(`● ${Math.floor(P.coins)}`, 66, 29);
    let ix = 10;
    for (const w of P.weapons) { drawIcon(ix, 46, WEP[w.id], w.lv, w.evo); ix += 22; }
    ix = 10;
    for (const id in P.pas) { drawIcon(ix, 69, PAS[id], P.pas[id]); ix += 22; }
    if (boss) {
      g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(30, H - 34, W - 60, 8); g.fillStyle = '#e5484d'; g.fillRect(30, H - 34, (W - 60) * Math.max(0, boss.hp / boss.max), 8);
      g.fillStyle = '#eef2ea'; g.font = '700 12px "Zen Kaku Gothic New", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'bottom'; g.fillText(boss.t.name, W / 2, H - 38);
    }
    if (banner) {
      banner.t += 0.016; const a = Math.min(1, banner.t * 4, (2.6 - banner.t) * 2);
      if (a <= 0) banner = null; else { g.globalAlpha = a; g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, H * 0.24 - 20, W, 40); g.fillStyle = banner.col; g.font = '700 18px "Zen Kaku Gothic New", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(banner.text, W / 2, H * 0.24); g.globalAlpha = 1; }
    }
    if (joy.on && state === 'play') {
      const r = cvs.getBoundingClientRect(), jx = (joy.ox - r.left) / S, jy = (joy.oy - r.top) / S, m = 46 / S;
      g.strokeStyle = 'rgba(255,255,255,0.22)'; g.lineWidth = 2; g.beginPath(); g.arc(jx, jy, m, 0, 6.283); g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.3)'; circ(jx + joy.dx * m, jy + joy.dy * m, m * 0.42);
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30); last = now; tt += dt; tones = 0;
    if (state === 'play') update(dt);
    if (shake > 0) shake -= dt; if (flash > 0) flash -= dt;
    draw();
    requestAnimationFrame(frame);
  }
  window.__dh = {
    info: () => ({ state, time, lvl: P.lvl, hp: P.hp, maxhp: P.maxhp, kills: P.kills, coins: P.coins, enemies: enemies.length, projs: projs.length, pickups: pickups.length, weapons: P.weapons.map(w => w.id + w.lv + (w.evo ? '*' : '')), pas: P.pas, hpMul }),
    step(dt) { tones = 0; update(dt); }, draw,
    bot() { // flee from the crowd, drift toward pickups
      let vx = 0, vy = 0;
      for (const e of enemies) { if (e.type === 'crate' || e.dead) continue; const dx = P.x - e.x, dy = P.y - e.y, d2 = dx * dx + dy * dy; if (d2 < 150 * 150) { const k = (e.t.boss ? 4000 : 900) / (d2 + 60); vx += dx * k; vy += dy * k; } }
      let bp = null, bd = 1e9; for (const p of pickups) { const d = Math.hypot(p.x - P.x, p.y - P.y); if (d < bd) { bd = d; bp = p; } }
      if (bp && bd < 260) { vx += (bp.x - P.x) / bd * 40; vy += (bp.y - P.y) / bd * 40; }
      vx += Math.cos(time * 0.3) * 4; vy += Math.sin(time * 0.23) * 4;
      const l = Math.hypot(vx, vy) || 1; joy.dx = vx / l; joy.dy = vy / l;
    },
    closeChest() { $('chestOk').click(); }, save
  };

  resize();
  title();
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
